name: Format PR 285 once

on:
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 285 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/mobile-prescription-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-prescription-workflow
          fetch-depth: 0

      - name: Complete patient record exhaustive switch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mobile/lib/features/dashboard/presentation/widgets/patient_record_sections.dart')
          text = path.read_text()
          old = """      PatientRecordSection.consultations => _ConsultationsSection(\n        record: record,\n      ),\n      PatientRecordSection.laboratory => _LaboratorySection(record: record),"""
          new = """      PatientRecordSection.consultations => _ConsultationsSection(\n        record: record,\n      ),\n      PatientRecordSection.prescriptions => const SizedBox.shrink(),\n      PatientRecordSection.laboratory => _LaboratorySection(record: record),"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif 'PatientRecordSection.prescriptions => const SizedBox.shrink(),' not in text:
              raise SystemExit('patient record switch anchor not found')
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format mobile
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test

      - name: Commit branch normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(mobile): format prescription workflow'
          git push origin HEAD:feat/mobile-prescription-workflow
