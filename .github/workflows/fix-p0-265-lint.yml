name: Temporary P0-265 Lint Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.pull_request.head.ref == 'feat/p0-265-realtime-transcription' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/p0-265-realtime-transcription
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Apply deterministic lint fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/lib/features/dashboard/application/clinical_speech_service.dart')
          text = path.read_text()
          old = """      var existing = await _gateway.getSession(_visitId);
                if (existing == null) {
                  existing = await _gateway.startSession(
                    _visitId,
                    _initialDraft,
                    locale: _locale,
                  );
                }
          """
          old = old.replace('              if', '      if')
          old = old.replace('                existing', '        existing')
          old = old.replace('                  _visitId', '          _visitId')
          old = old.replace('                  _initialDraft', '          _initialDraft')
          old = old.replace('                  locale', '          locale')
          old = old.replace('                );', '        );')
          old = old.replace('              }', '      }')

          new = """      var existing = await _gateway.getSession(_visitId);
                existing ??= await _gateway.startSession(
                  _visitId,
                  _initialDraft,
                  locale: _locale,
                );
          """
          new = new.replace('              existing', '      existing')
          new = new.replace('                _visitId', '        _visitId')
          new = new.replace('                _initialDraft', '        _initialDraft')
          new = new.replace('                locale', '        locale')
          new = new.replace('              );', '      );')

          if old not in text:
              raise SystemExit('Expected initialization block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format, self-delete and push
        shell: bash
        run: |
          set -euo pipefail
          dart format mobile/lib/features/dashboard/application/clinical_speech_service.dart
          git rm .github/workflows/fix-p0-265-lint.yml
          git add mobile/lib/features/dashboard/application/clinical_speech_service.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(mobile): simplifier l'initialisation de session realtime"
          git push origin HEAD:feat/p0-265-realtime-transcription
