name: Normalize MOB-2801 changelog once

on:
  push:
    branches:
      - feat/mob-2801-flutter-bootstrap

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mob-2801-flutter-bootstrap
          fetch-depth: 0
      - name: Restore unrelated changelog text exactly
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/ai/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          changed = "Le flux de transcription en direct s'affiche désormais sous le bloc micro dans un conteneur"
          original = "Le flux de transcription en direct s'affiche désormais sous le bloc du micro dans un conteneur"
          if changed not in text:
              raise SystemExit('Expected unrelated wording drift not found')
          text = text.replace(changed, original, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow and commit normalization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-mob2801-changelog-once.yml
          git config user.name 'joprelys-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ai/CHANGELOG.md .github/workflows/normalize-mob2801-changelog-once.yml
          git commit -m 'docs(mobile): préserver le changelog existant'
          git push origin HEAD:feat/mob-2801-flutter-bootstrap
