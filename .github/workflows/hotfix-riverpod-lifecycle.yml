name: Temporary Riverpod lifecycle hotfix

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.pull_request.head.ref == 'agent/restore-instant-ai-dictation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply lifecycle-safe provider updates
        shell: python
        run: |
          from pathlib import Path
          path = Path('mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart')
          text = path.read_text()
          text = text.replace(
              "  late final AnimationController _waveController;\n",
              "  late final AnimationController _waveController;\n  late final AppForegroundActivityController _activityController;\n",
          )
          text = text.replace(
              "    ref\n        .read(appForegroundActivityProvider.notifier)\n        .activate(AppForegroundActivity.clinicalVoiceAssistant);\n",
              "    _activityController = ref.read(appForegroundActivityProvider.notifier);\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (!mounted) return;\n      _activityController.activate(\n        AppForegroundActivity.clinicalVoiceAssistant,\n      );\n    });\n",
          )
          text = text.replace(
              "    ref\n        .read(appForegroundActivityProvider.notifier)\n        .deactivate(AppForegroundActivity.clinicalVoiceAssistant);\n",
              "    WidgetsBinding.instance.addPostFrameCallback((_) {\n      _activityController.deactivate(\n        AppForegroundActivity.clinicalVoiceAssistant,\n      );\n    });\n",
          )
          path.write_text(text)

          test = Path('mobile/test/clinical_voice_provider_lifecycle_test.dart')
          test.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('clinical voice provider updates are deferred outside lifecycle methods', () {
    final source = File(
      'lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart',
    ).readAsStringSync();

    final initStart = source.indexOf('void initState()');
    final lifecycleStart = source.indexOf('void didChangeAppLifecycleState');
    final disposeStart = source.indexOf('void dispose()');
    final closeStart = source.indexOf('Future<void> _toggleListening');

    final initBlock = source.substring(initStart, lifecycleStart);
    final disposeBlock = source.substring(disposeStart, closeStart);

    expect(initBlock, contains('addPostFrameCallback'));
    expect(initBlock, isNot(contains('.activate(AppForegroundActivity.clinicalVoiceAssistant);')));
    expect(disposeBlock, contains('addPostFrameCallback'));
    expect(disposeBlock, isNot(contains('ref.read(appForegroundActivityProvider.notifier)')));
  });
}
""")
      - name: Validate
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart mobile/test/clinical_voice_provider_lifecycle_test.dart
          git diff --cached --quiet || git commit -m "fix(mobile): defer provider updates outside widget lifecycle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
