name: Temporary mobile formatter

on:
  push:
    branches:
      - fix/mobile-cloud-speech-progressive-contract

permissions:
  contents: write

jobs:
  format-mobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-cloud-speech-progressive-contract
          fetch-depth: 0

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format mobile sources
        run: dart format mobile/lib mobile/test

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          if git diff --cached --quiet; then
            echo "No formatting change required."
            exit 0
          fi
          git commit -m "style(mobile): appliquer dart format"
          git push origin HEAD:fix/mobile-cloud-speech-progressive-contract
