name: Hotfix backend diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven and capture tail
        shell: bash
        run: |
          set +e
          cd backend
          chmod +x mvnw
          ./mvnw -B -ntp clean verify > "$RUNNER_TEMP/maven-full.log" 2>&1
          code=$?
          tail -n 250 "$RUNNER_TEMP/maven-full.log" > "$RUNNER_TEMP/maven-tail.log"
          echo "$code" > "$RUNNER_TEMP/maven-exit-code"
          exit 0
      - name: Upload Maven diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-backend-diagnostic
          path: |
            ${{ runner.temp }}/maven-tail.log
            ${{ runner.temp }}/maven-exit-code
          if-no-files-found: error
      - name: Propagate Maven result
        shell: bash
        run: exit "$(cat "$RUNNER_TEMP/maven-exit-code")"
