name: Format PR 283 once

on:
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 283 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/voice-start-and-compact-capture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-start-and-compact-capture
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format only changed Dart files
        working-directory: mobile
        run: |
          dart format \
            lib/features/dashboard/application/cloud_speech_streaming_service.dart \
            lib/features/dashboard/presentation/widgets/clinical_voice_progressive_assistant_sections.dart \
            test/clinical_voice_compact_capture_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/dashboard/application/cloud_speech_streaming_service.dart \
                  mobile/lib/features/dashboard/presentation/widgets/clinical_voice_progressive_assistant_sections.dart \
                  mobile/test/clinical_voice_compact_capture_test.dart
          git commit -m "style(voice): appliquer dart format"
          git push origin HEAD:fix/voice-start-and-compact-capture
