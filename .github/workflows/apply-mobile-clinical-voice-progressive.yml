name: Apply mobile clinical voice progressive integration

on:
  push:
    branches:
      - fix/mobile-clinical-voice-progressive-sync
    paths:
      - .github/workflows/apply-mobile-clinical-voice-progressive.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-clinical-voice-progressive-sync
          fetch-depth: 0

      - name: Apply focused source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          sheet = 'mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart'
          replace(
              sheet,
              "import '../../application/clinical_speech_service.dart';\nimport '../../data/clinical_voice_ai_api.dart';",
              "import '../../application/clinical_speech_service.dart';\nimport '../../application/clinical_voice_progressive_coordinator.dart';\nimport '../../data/clinical_voice_ai_api.dart';\nimport '../../data/clinical_voice_capture_api.dart';",
          )
          replace(
              sheet,
              "import 'clinical_voice_review_widgets.dart';\nimport 'clinical_voice_segment_timeline.dart';",
              "import 'clinical_voice_review_widgets.dart';\nimport 'clinical_voice_progressive_preview.dart';\nimport 'clinical_voice_segment_timeline.dart';",
          )
          replace(
              sheet,
              '  late final ClinicalSpeechService _speechService;\n  late final AnimationController _haloController;',
              '  late final ClinicalSpeechService _speechService;\n  late final ClinicalVoiceProgressiveCoordinator _progressiveCoordinator;\n  late final AnimationController _haloController;',
          )
          replace(
              sheet,
              "    _speechService = ClinicalSpeechService(\n      gateway: ref.read(clinicalVoiceAiApiProvider),\n      visitId: widget.visit.id,\n      initialDraft: widget.initialDraft,\n      locale: widget.locale,\n    );\n    Future.microtask(_speechService.initialize);",
              "    final aiGateway = ref.read(clinicalVoiceAiApiProvider);\n    _speechService = ClinicalSpeechService(\n      gateway: aiGateway,\n      visitId: widget.visit.id,\n      initialDraft: widget.initialDraft,\n      locale: widget.locale,\n    );\n    _progressiveCoordinator = ClinicalVoiceProgressiveCoordinator(\n      speechService: _speechService,\n      aiGateway: aiGateway,\n      captureGateway: ref.read(clinicalVoiceCaptureApiProvider),\n      visitId: widget.visit.id,\n      initialDraft: widget.initialDraft,\n      locale: widget.locale,\n    );\n    Future.microtask(() async {\n      await _speechService.initialize();\n      await _progressiveCoordinator.start();\n    });",
          )
          replace(
              sheet,
              '    _speechService.dispose();\n    _haloController.dispose();',
              '    _progressiveCoordinator.dispose();\n    _speechService.dispose();\n    _haloController.dispose();',
          )
          replace(
              sheet,
              '    if (confirmed == true) await _speechService.clearTranscript();',
              '    if (confirmed == true) await _progressiveCoordinator.clearAll();',
          )
          replace(
              sheet,
              '    await _speechService.completeCapture();',
              '    await _progressiveCoordinator.completeCapture();',
          )
          replace(
              sheet,
              '  String _reference() {',
              "  Future<void> _retrySynchronization() async {\n    final localSaved = await _speechService.retryDraftSave();\n    if (localSaved) await _progressiveCoordinator.synchronizeNow();\n  }\n\n  String _reference() {",
          )
          replace(
              sheet,
              '                          onAnalyze: _speechService.analyzeTranscript,\n                          onRetrySave: _speechService.retryDraftSave,',
              '                          onAnalyze: _progressiveCoordinator.finishAndReview,\n                          onRetrySave: _retrySynchronization,',
          )
          replace(
              sheet,
              "                ),\n                if (processing) ...[\n                  const SizedBox(height: 14),\n                  _AnalysisProgressCard(",
              "                ),\n                if (state.hasApplicableResult && !processing) ...[\n                  const SizedBox(height: 14),\n                  ClinicalVoiceProgressivePreview(state: state),\n                ],\n                if (processing) ...[\n                  const SizedBox(height: 14),\n                  _AnalysisProgressCard(",
          )

          api = 'mobile/lib/features/dashboard/data/clinical_voice_ai_api.dart'
          replace(
              api,
              "    // Une ouverture de l'assistant correspond à une nouvelle capture clinique.\n    // On valide la réponse puis on supprime toute session précédente afin que le\n    // brouillon SOAP courant soit la seule base du prochain POST /sessions.\n    final existing = _optionalObjectFrom(\n      response.data,\n      'Invalid AI session response',\n    );\n    if (existing == null) return null;\n    await _client.delete<void>('/api/ai/consultations/$visitId/session');\n    return null;",
              "    final existing = _optionalObjectFrom(\n      response.data,\n      'Invalid AI session response',\n    );\n    return existing == null ? null : ClinicalAiState.fromJson(existing);",
          )

          test = 'mobile/test/clinical_voice_ai_api_test.dart'
          replace(
              test,
              "    test('deletes an existing session before starting a new capture', () async {\n      var requestIndex = 0;\n      final adapter = QueueHttpClientAdapter((options, _) {\n        requestIndex++;\n        if (requestIndex == 1) {\n          expect(options.method, 'GET');\n          expect(options.path, '/api/ai/consultations/visit-123/session');\n          return jsonResponse(200, sessionViewJson());\n        }\n        expect(options.method, 'DELETE');\n        expect(options.path, '/api/ai/consultations/visit-123/session');\n        return ResponseBody.fromString('', 204);\n      });\n      final api = buildApi(adapter);\n\n      expect(await api.getSession('visit-123'), isNull);\n      expect(adapter.requests, hasLength(2));\n    });",
              "    test('returns an existing session without deleting it', () async {\n      final adapter = QueueHttpClientAdapter((options, _) {\n        expect(options.method, 'GET');\n        expect(options.path, '/api/ai/consultations/visit-123/session');\n        return jsonResponse(200, sessionViewJson());\n      });\n      final api = buildApi(adapter);\n\n      final state = await api.getSession('visit-123');\n      expect(state?.sessionId, 'session-123');\n      expect(state?.visitId, 'visit-123');\n      expect(state?.transcriptStatus, 'ANALYZED');\n      expect(adapter.requests, hasLength(1));\n    });",
          )
          replace(
              test,
              "    test('also resets a SessionView returned as a JSON string', () async {\n      var requestIndex = 0;\n      final adapter = QueueHttpClientAdapter((options, _) {\n        requestIndex++;\n        if (requestIndex == 1) {\n          return stringResponse(200, jsonEncode(sessionViewJson()));\n        }\n        expect(options.method, 'DELETE');\n        return ResponseBody.fromString('', 204);\n      });\n      final api = buildApi(adapter);\n\n      expect(await api.getSession('visit-123'), isNull);\n      expect(adapter.requests, hasLength(2));\n    });",
              "    test('decodes a SessionView returned as a JSON string', () async {\n      final adapter = QueueHttpClientAdapter(\n        (_, _) => stringResponse(200, jsonEncode(sessionViewJson())),\n      );\n      final api = buildApi(adapter);\n\n      final state = await api.getSession('visit-123');\n      expect(state?.sessionId, 'session-123');\n      expect(state?.noteFrom().symptoms, 'Mal de tête depuis trois semaines');\n      expect(adapter.requests, hasLength(1));\n    });",
          )

          capture_test = 'mobile/test/clinical_voice_capture_first_restoration_test.dart'
          replace(
              capture_test,
              "    expect(sheet, contains('Future.microtask(_speechService.initialize)'));\n    expect(\n      sheet,\n      isNot(contains('Future.microtask(_speechService.restoreOrStart)')),\n    );",
              "    expect(sheet, contains('await _speechService.initialize()'));\n    expect(sheet, contains('await _progressiveCoordinator.start()'));\n    expect(\n      sheet,\n      isNot(contains('Future.microtask(_speechService.restoreOrStart)')),\n    );",
          )
          replace(
              capture_test,
              "  test('capture never sends one network request per recognized passage', () {\n    final source = File(\n      'lib/features/dashboard/application/clinical_speech_service.dart',\n    ).readAsStringSync();\n\n    expect(source, isNot(contains('_gateway.savePendingTranscript')));\n    expect(source, contains('ClinicalTranscriptDraftGateway'));\n    expect(source, contains('_draftStore.write'));\n    expect(source, contains('_draftDebounce'));\n    expect(source, contains('return _ensureTranscriptPersisted();'));\n  });",
              "  test('capture persists finalized passages before progressive analysis', () {\n    final source = File(\n      'lib/features/dashboard/application/clinical_voice_progressive_coordinator.dart',\n    ).readAsStringSync();\n\n    final ingest = source.indexOf('await _captureGateway.ingestSegment(');\n    final analyze = source.indexOf(\n      'await _captureGateway.analyzeProgressiveSegment(',\n      ingest,\n    );\n    expect(ingest, greaterThanOrEqualTo(0));\n    expect(analyze, greaterThan(ingest));\n    expect(source, contains('Future<void> _serial = Future<void>.value()'));
    expect(source, contains('final rebuild'));
  });",
          )
          PY

          git diff --check
          git config user.name "Joprelys Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          git commit -m "fix(mobile): integrate progressive durable clinical dictation"
          git push origin HEAD:fix/mobile-clinical-voice-progressive-sync
