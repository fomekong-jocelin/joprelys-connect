name: Repair mobile lockfile once

on:
  push:
    branches:
      - feat/mob-2801-flutter-bootstrap

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mob-2801-flutter-bootstrap
      - name: Repair lockfile copied from CI artifact
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('mobile/pubspec.lock')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '75cca69d1490965be98c73ceaea117e8a04dd21217b37b292c9ddbec0d955bc5b',
              '75cca69d1490965be98c73ceaea117e8a04dd21217b37b292c9ddbec0d955bc5',
          )
          text = text.replace(
              '56a02f1f4cd1d96303c0144c93bd6d909eea6bee6bf5a0e0b685edbd4c47ab',
              '56a02f1f4cd1a2d96303c0144c93bd6d909eea6bee6bf5a0e0b685edbd4c47ab',
          )
          hashes = re.findall(r'sha256:\s+"?([0-9a-f]+)"?', text)
          invalid = [value for value in hashes if len(value) != 64]
          if invalid:
              raise SystemExit(f'Invalid SHA-256 lengths remain: {invalid}')
          path.write_text(text, encoding='utf-8')
      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/pubspec.lock; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'joprelys-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile/pubspec.lock
          git commit -m 'fix(mobile): repair generated pubspec lock checksums'
          git push origin HEAD:feat/mob-2801-flutter-bootstrap
