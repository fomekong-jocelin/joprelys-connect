name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed stacks
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code for change detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend and frontend changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          is_valid_sha() {
            local sha="${1:-}"
            [[ -n "$sha" && "$sha" != "0000000000000000000000000000000000000000" ]]
          }

          ensure_commit() {
            local sha="$1"
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha" >/dev/null 2>&1 || true
            git cat-file -e "${sha}^{commit}" 2>/dev/null
          }

          use_global_pr_diff() {
            FROM_SHA="$PR_BASE_SHA"
            TO_SHA="$PR_HEAD_SHA"
            MODE="pr-global"
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            FROM_SHA="$EVENT_BEFORE"
            TO_SHA="$EVENT_AFTER"
            MODE="push-delta"
          elif [[ "$EVENT_ACTION" == "synchronize" ]] && is_valid_sha "$EVENT_BEFORE" && is_valid_sha "$EVENT_AFTER"; then
            FROM_SHA="$EVENT_BEFORE"
            TO_SHA="$EVENT_AFTER"
            MODE="pr-synchronize-delta"
          else
            use_global_pr_diff
          fi

          if ! is_valid_sha "$FROM_SHA" || ! is_valid_sha "$TO_SHA" || [[ "$FROM_SHA" == "$TO_SHA" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              use_global_pr_diff
            else
              echo "Invalid push comparison range; forcing both stacks for safety."
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! ensure_commit "$FROM_SHA" || ! ensure_commit "$TO_SHA"; then
            if [[ "$EVENT_NAME" == "pull_request" && "$MODE" != "pr-global" ]]; then
              echo "Incremental PR range unavailable; falling back to global PR diff."
              use_global_pr_diff
            fi
          fi

          if ! ensure_commit "$FROM_SHA" || ! ensure_commit "$TO_SHA"; then
            echo "Comparison range unavailable; forcing both stacks for safety."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detection mode: $MODE"
          echo "Comparing $FROM_SHA -> $TO_SHA"

          CHANGED_FILES="$(git diff --name-only "$FROM_SHA" "$TO_SHA")"
          printf '%s\n' "$CHANGED_FILES"

          BACKEND=false
          FRONTEND=false

          if grep -Eq '^\.github/workflows/ci\.yml$' <<< "$CHANGED_FILES"; then
            BACKEND=true
            FRONTEND=true
          else
            if grep -Eq '^backend/' <<< "$CHANGED_FILES"; then
              BACKEND=true
            fi
            if grep -Eq '^web/' <<< "$CHANGED_FILES"; then
              FRONTEND=true
            fi
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"

  backend-build:
    name: Backend — Maven Build & Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and verify (Maven strict)
        run: ./mvnw clean verify -B --no-transfer-progress -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026
      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend Angular — Build & Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Restore Angular compiler cache
        uses: actions/cache@v4
        with:
          path: web/.angular/cache
          key: angular-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json', 'web/angular.json', 'web/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json', 'web/angular.json', 'web/tsconfig*.json') }}-
            angular-${{ runner.os }}-node22-
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log
      - name: Upload frontend test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: web/frontend-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Angular production
        run: npm run build
