name: Joprelys Connect — STORY-2203 Cleanup

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    name: STORY-2203 — Restore permanent CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-2203-cashier-collection-queue
          fetch-depth: 0

      - name: Restore permanent files
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python - <<'PY'
          from pathlib import Path

          package_file = Path('web/package.json')
          content = package_file.read_text(encoding='utf-8')
          content = content.replace('"test": "ng build"', '"test": "ng test"')
          content = content.replace('"test": "ng test --include=src/app/clinic/billing/billing-payment-modal.component.spec.ts"', '"test": "ng test"')
          package_file.write_text(content, encoding='utf-8')
          PY
          rm -f web/scripts/ci-test-diagnostic.sh
          rm -f docs/ai/diagnostics/STORY-2203-*.txt

      - name: Commit clean branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(story-2203): retirer les diagnostics et restaurer la CI"
          git push origin HEAD:feature/story-2203-cashier-collection-queue
