name: Apply clinical voice capture-first fix

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: clinical-voice-capture-first-fix
  cancel-in-progress: true

jobs:
  apply-validate-and-clean:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/restore-instant-ai-dictation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-instant-ai-dictation
          fetch-depth: 0

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply capture-first restoration
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('mobile/lib/features/dashboard/application/clinical_speech_service.dart')
          service = service_path.read_text()
          old = '''    if (existing.revisions.isNotEmpty ||
              existing.hasAcceptedChanges ||
              existing.needsClarification) {
            if (transcript?.isNotEmpty == true) {
              _replaceSegmentsWithTranscript(transcript!);
            }
            _applyAiState(existing);
            return;
          }

          '''
          count = service.count(old)
          if count != 1:
              raise RuntimeError(f'capture-first restoration block: expected 1 occurrence, found {count}')
          service_path.write_text(service.replace(old, '', 1))

          test_path = Path('mobile/test/clinical_voice_capture_first_restoration_test.dart')
          test_path.write_text("""import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('an existing AI session reopens on editable dictation', () {
              final source = File(
                'lib/features/dashboard/application/clinical_speech_service.dart',
              ).readAsStringSync();
              final start = source.indexOf('void _restoreExistingSession');
              final end = source.indexOf(
                'void _replaceSegmentsWithTranscript',
                start,
              );
              expect(start, greaterThanOrEqualTo(0));
              expect(end, greaterThan(start));

              final restoration = source.substring(start, end);
              expect(restoration, isNot(contains('_applyAiState(existing)')));
              expect(restoration, contains('SpeechStatus.transcriptReview'));
              expect(restoration, contains('ClinicalVoiceStage.capture'));
            });

            test('capture screen keeps edit, delete, clear and microphone actions', () {
              final source = File(
                'lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart',
              ).readAsStringSync();
              expect(source, contains('ClinicalTranscriptTimeline('));
              expect(source, contains('editable: !listening && !processing'));
              expect(source, contains('onSegmentChanged: onSegmentChanged'));
              expect(source, contains('onSegmentDeleted: onSegmentDeleted'));
              expect(source, contains('onPressed: onClearAll'));
              expect(source, contains('onToggleListening: onToggleListening'));
            });
          }
          """)

      - name: Validate Flutter application
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Restore standard CI
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            mobile/lib/features/dashboard/application/clinical_speech_service.dart \
            mobile/test/clinical_voice_capture_first_restoration_test.dart
          git diff --cached --quiet || git commit -m "fix(mobile): reopen voice assistant on editable dictation"
          git push origin HEAD:agent/restore-instant-ai-dictation
