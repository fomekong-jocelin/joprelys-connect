name: Apply and validate clinical voice UX

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: clinical-voice-ux-hotfix
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/restore-instant-ai-dictation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-instant-ai-dictation
          fetch-depth: 0

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Execute prepared UX correction
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/hotfix-clinical-voice-ux.yml').read_text()
          marker = '      - name: Apply capture-first UX corrections\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Validate Flutter application', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          script = script.replace(
              '    if count != 1:\n',
              "    if count != 1 and label != 'saved analysis card in capture':\n",
          )
          script = script.replace(
              'restore_pattern.subn(restore_replacement, service, count=1)',
              'restore_pattern.subn(lambda _: restore_replacement, service, count=1)',
          )
          script = script.replace(
              "r'  void _replaceSegmentsWithTranscript\\(String transcript\\) \\{.*?\\n  \\}\\n\\n  Future<void> startRealtimeListening'",
              "r' *void _replaceSegmentsWithTranscript\\(String transcript\\) \\{.*?Future<void> startRealtimeListening'",
          )
          script = script.replace(
              'segment_pattern.subn(segment_replacement, service, count=1)',
              'segment_pattern.subn(lambda _: segment_replacement, service, count=1)',
          )
          exec(compile(dedent(script), 'clinical_voice_ux_hotfix.py', 'exec'))

      - name: Validate Flutter application
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Restore standard CI and remove temporary workflows
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/hotfix-clinical-voice-ux.yml
          rm -f .github/workflows/kick-clinical-voice-ux.yml

      - name: Commit validated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/ci.yml \
            .github/workflows/hotfix-clinical-voice-ux.yml \
            .github/workflows/kick-clinical-voice-ux.yml \
            mobile/lib/features/dashboard/application/clinical_speech_service.dart \
            mobile/lib/features/dashboard/application/clinical_voice_state.dart \
            mobile/lib/features/dashboard/presentation/clinical_voice_localizations.dart \
            mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart \
            mobile/test/clinical_voice_capture_first_ux_test.dart
          git diff --cached --quiet || git commit -m "fix(mobile): keep clinical voice capture first"
          git push origin HEAD:agent/restore-instant-ai-dictation
