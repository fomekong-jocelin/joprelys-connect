name: STORY-2204 — Clôture documentaire

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/close-story-2204
          fetch-depth: 0
      - name: Insert STORY-2204 changelog entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ai/CHANGELOG.md')
          text = path.read_text()
          marker = '### Added\n\n'
          entry = ('- **Poste assurance et progression des bordereaux (STORY-2204)** : '
                   'ajout d’un workspace tenanté pour suivre les bordereaux de `DRAFT` à `SETTLED`, '
                   'avec réception et référence assureur, acceptation ou rejet motivé, montants réclamés/acceptés/réglés/restants, '
                   'paiements partiels cumulés sans dépassement, synchronisation des créances assurance, migration `BigDecimal`, '
                   'RBAC financier, filtres, responsive light/dark, accessibilité clavier et traductions FR/EN.\n')
          if 'Poste assurance et progression des bordereaux (STORY-2204)' not in text:
              if marker not in text:
                  raise SystemExit('Section Added introuvable dans le changelog')
              text = text.replace(marker, marker + entry + '\n', 1)
              path.write_text(text)
          PY
      - name: Restore permanent CI workflow
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit closure changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/CHANGELOG.md .github/workflows/ci.yml
          git commit -m "docs(changelog): enregistrer STORY-2204"
          git push origin HEAD:docs/close-story-2204
