name: Joprelys Connect — STORY-2203 Diagnostic

on:
  push:
    branches: [feature/story-2203-cashier-collection-queue]

permissions:
  contents: read

jobs:
  frontend-diagnostic:
    name: STORY-2203 — Frontend diagnostic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Capture Angular build
        id: build
        shell: bash
        run: |
          set +e
          npx ng build > "$RUNNER_TEMP/angular-build.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture Angular tests
        id: tests
        shell: bash
        run: |
          set +e
          npx ng test > "$RUNNER_TEMP/angular-tests.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-2203-frontend-diagnostics
          path: |
            ${{ runner.temp }}/angular-build.log
            ${{ runner.temp }}/angular-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when frontend validation failed
        if: steps.build.outputs.status != '0' || steps.tests.outputs.status != '0'
        run: exit 1

  backend-diagnostic:
    name: STORY-2203 — Backend diagnostic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Capture Maven verification
        id: maven
        shell: bash
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026
        run: |
          set +e
          ./mvnw clean verify -B -Dspring.profiles.active=test > "$RUNNER_TEMP/maven-verify.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-2203-backend-diagnostics
          path: ${{ runner.temp }}/maven-verify.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when backend validation failed
        if: steps.maven.outputs.status != '0'
        run: exit 1
