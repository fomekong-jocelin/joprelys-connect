name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code for push comparison
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect backend and frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/**'
              - '.github/workflows/ci.yml'

  backend-build:
    name: Backend — Maven Build & Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and verify (Maven strict)
        run: ./mvnw clean verify -B --no-transfer-progress -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026
      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend Angular — Build & Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Restore Angular compiler cache
        uses: actions/cache@v4
        with:
          path: web/.angular/cache
          key: angular-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json', 'web/angular.json', 'web/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json', 'web/angular.json', 'web/tsconfig*.json') }}-
            angular-${{ runner.os }}-node22-
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log
      - name: Upload frontend test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: web/frontend-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Angular production
        run: npm run build
