name: Format clinical voice sources

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: clinical-voice-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-mobile:
    if: github.event.pull_request.head.ref == 'agent/restore-instant-ai-dictation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-instant-ai-dictation

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format changed Dart sources
        working-directory: mobile
        run: |
          dart format \
            lib/features/dashboard/application/clinical_speech_hypothesis.dart \
            lib/features/dashboard/application/clinical_speech_service.dart \
            lib/features/dashboard/application/clinical_voice_state.dart \
            lib/features/dashboard/data/clinical_voice_ai_api.dart \
            lib/features/dashboard/presentation/clinical_voice_localizations.dart \
            lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart \
            lib/features/dashboard/presentation/widgets/clinical_voice_listening_surface.dart \
            lib/features/dashboard/presentation/widgets/clinical_voice_segment_timeline.dart \
            test/clinical_speech_hypothesis_test.dart \
            test/clinical_voice_ai_api_test.dart

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: clinical-voice-formatted-sources
          if-no-files-found: error
          retention-days: 1
          path: |
            mobile/lib/features/dashboard/application/clinical_speech_hypothesis.dart
            mobile/lib/features/dashboard/application/clinical_speech_service.dart
            mobile/lib/features/dashboard/application/clinical_voice_state.dart
            mobile/lib/features/dashboard/data/clinical_voice_ai_api.dart
            mobile/lib/features/dashboard/presentation/clinical_voice_localizations.dart
            mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart
            mobile/lib/features/dashboard/presentation/widgets/clinical_voice_listening_surface.dart
            mobile/lib/features/dashboard/presentation/widgets/clinical_voice_segment_timeline.dart
            mobile/test/clinical_speech_hypothesis_test.dart
            mobile/test/clinical_voice_ai_api_test.dart
