name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, develop]
    # Draft PRs are the development workspace. A full CI gate is deliberately
    # requested by moving the PR to Ready. New commits pushed after that gate
    # only run the cheap freshness guard and require Draft -> Ready again.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      build_mobile_apk:
        description: 'Construire aussi l’APK debug Flutter'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate-freshness:
    name: PR gate freshness
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require a deliberate gate for the new HEAD
        shell: bash
        run: |
          echo "::error title=CI gate stale::New commits were pushed after this PR was Ready. Convert the PR to Draft, finish the changes, then move it back to Ready to run the full gate once on the final HEAD."
          exit 1

  changes:
    name: Detect changed stacks
    # Heavy validation is only started on pushes to protected integration branches,
    # on a manual run, or on an explicit PR gate event. A synchronize event on an
    # already-Ready PR is handled by the cheap freshness guard above.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'synchronize') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout code for change detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend, frontend and mobile changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          is_valid_sha() {
            local sha="${1:-}"
            [[ -n "$sha" && "$sha" != "0000000000000000000000000000000000000000" ]]
          }

          ensure_commit() {
            local sha="$1"
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha" >/dev/null 2>&1 || true
            git cat-file -e "${sha}^{commit}" 2>/dev/null
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual mobile validation requested."
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            FROM_SHA="$EVENT_BEFORE"
            TO_SHA="$EVENT_AFTER"
            MODE="push-delta"
          else
            FROM_SHA="$PR_BASE_SHA"
            TO_SHA="$PR_HEAD_SHA"
            MODE="pr-final-gate"
          fi

          if ! is_valid_sha "$FROM_SHA" || ! is_valid_sha "$TO_SHA" || [[ "$FROM_SHA" == "$TO_SHA" ]]; then
            echo "Invalid comparison range; forcing all stacks for safety."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! ensure_commit "$FROM_SHA" || ! ensure_commit "$TO_SHA"; then
            echo "Comparison range unavailable; forcing all stacks for safety."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detection mode: $MODE"
          echo "Comparing $FROM_SHA -> $TO_SHA"

          CHANGED_FILES="$(git diff --name-only "$FROM_SHA" "$TO_SHA")"
          printf '%s\n' "$CHANGED_FILES"

          BACKEND=false
          FRONTEND=false
          MOBILE=false

          # Workflow-only changes do not force every expensive stack. GitHub validates
          # the workflow syntax, while code changes still select their own stack below.
          if grep -Eq '^backend/' <<< "$CHANGED_FILES"; then
            BACKEND=true
          fi
          if grep -Eq '^web/' <<< "$CHANGED_FILES"; then
            FRONTEND=true
          fi
          if grep -Eq '^mobile/' <<< "$CHANGED_FILES"; then
            MOBILE=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"

  backend-build:
    name: Backend — Maven Build & Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and verify (Maven strict)
        shell: bash
        run: |
          set -o pipefail
          ./mvnw clean verify -B --no-transfer-progress -Dspring.profiles.active=test 2>&1 | tee backend-verify.log
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026
      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/backend-verify.log
            backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend Angular — Build & Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Restore Angular compiler cache
        uses: actions/cache@v4
        with:
          path: web/.angular/cache
          key: angular-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json', 'web/angular.json', 'web/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json', 'web/angular.json', 'web/tsconfig*.json') }}-
            angular-${{ runner.os }}-node22-
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log
      - name: Upload frontend test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: web/frontend-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Angular production
        run: npm run build

  mobile-build:
    name: Mobile Flutter — Format, Analyze & Tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply speech API compatibility adjustments
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('lib/features/dashboard/application/clinical_speech_service.dart')
          source = service.read_text()
          old = """        listenFor: const Duration(hours: 1),
                  pauseFor: const Duration(seconds: 8),
                  partialResults: true,
                  cancelOnError: false,
                  listenMode: stt.ListenMode.dictation,
                  localeId: _speechLocale,
          """
          new = """        listenOptions: stt.SpeechListenOptions(
                    listenFor: const Duration(hours: 1),
                    pauseFor: const Duration(seconds: 8),
                    partialResults: true,
                    cancelOnError: false,
                    listenMode: stt.ListenMode.dictation,
                    localeId: _speechLocale,
                  ),
          """
          if old in source:
              service.write_text(source.replace(old, new))
          elif 'listenOptions: stt.SpeechListenOptions(' not in source:
              raise SystemExit('speech listen options block not found')

          timeline = Path(
              'lib/features/dashboard/presentation/widgets/'
              'clinical_voice_segment_timeline.dart'
          )
          source = timeline.read_text()
          timeline.write_text(source.replace("import 'dart:ui';\n\n", '', 1))
          PY
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Commit validated mobile sources
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.lock
          if git diff --cached --quiet; then
            echo "No validated source update to commit."
          else
            git commit -m "fix(mobile): format and validate segmented dictation"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Build debug APK on demand
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mobile_apk }}
        run: flutter build apk --debug --no-pub
