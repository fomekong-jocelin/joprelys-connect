name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  story-2202-surgical-diff:
    name: STORY-2202 — Rebuild surgical parent diff
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/story-2202-invoice-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-2202-invoice-workspace
          fetch-depth: 0
      - name: Rebuild parent files from main with targeted changes only
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          from pathlib import Path

          repo = Path('.')

          def from_main(path: str) -> str:
              return subprocess.check_output(
                  ['git', 'show', f'origin/main:{path}'],
                  text=True,
                  encoding='utf-8',
              )

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          ts_path = 'web/src/app/clinic/billing/billing-management-page.component.ts'
          ts = from_main(ts_path)
          ts = replace_once(
              ts,
              "import { Component, OnInit, inject, signal, computed } from '@angular/core';\n",
              "import { Component, ElementRef, NgZone, OnInit, ViewChild, inject, signal, computed } from '@angular/core';\n",
              'Angular imports',
          )
          ts = replace_once(
              ts,
              "import { ActivatedRoute } from '@angular/router';\n",
              "import { ActivatedRoute } from '@angular/router';\nimport { catchError, finalize, forkJoin, of, take } from 'rxjs';\n",
              'RxJS imports',
          )
          ts = replace_once(
              ts,
              "  private readonly route = inject(ActivatedRoute);\n",
              "  private readonly route = inject(ActivatedRoute);\n  private readonly zone = inject(NgZone);\n\n  @ViewChild('invoiceDetailsPanel')\n  private invoiceDetailsPanel?: ElementRef<HTMLElement>;\n\n  @ViewChild(BillingInvoiceHistoryComponent)\n  private invoiceHistory?: BillingInvoiceHistoryComponent;\n",
              'ViewChild fields',
          )
          ts = replace_once(
              ts,
              "  invoiceSettlements = signal<Record<string, InvoiceSettlementSummary>>({});\n  selectedInvoiceForEstimates = signal<Invoice | null>(null);\n",
              "  invoiceSettlements = signal<Record<string, InvoiceSettlementSummary>>({});\n  invoiceHistoryLoading = signal(false);\n  invoiceHistoryError = signal(false);\n  selectedInvoiceForEstimates = signal<Invoice | null>(null);\n",
              'History signals',
          )
          ts = replace_once(
              ts,
              """  loadPatientHistory(patientId: string): void {
    this.billingApi.listInvoices(patientId).subscribe({
      next: (res) => this.invoices.set(res),
      error: () => this.showError('billing.error.load')
    });
    this.billingApi.listInvoiceSettlementSummaries(patientId).subscribe({
      next: (summaries) => this.invoiceSettlements.set(
        Object.fromEntries(summaries.map(s => [s.invoiceId, s]))
      ),
      error: () => this.invoiceSettlements.set({})
    });
  }
""",
              """  loadPatientHistory(patientId: string): void {
    this.invoiceHistoryLoading.set(true);
    this.invoiceHistoryError.set(false);

    forkJoin({
      invoices: this.billingApi.listInvoices(patientId),
      summaries: this.billingApi.listInvoiceSettlementSummaries(patientId).pipe(
        catchError(() => of([] as InvoiceSettlementSummary[]))
      ),
    }).pipe(
      finalize(() => this.invoiceHistoryLoading.set(false))
    ).subscribe({
      next: ({ invoices, summaries }) => {
        this.invoices.set(invoices);
        this.invoiceSettlements.set(Object.fromEntries(
          summaries.map(summary => [summary.invoiceId, summary])
        ));
      },
      error: () => {
        this.invoices.set([]);
        this.invoiceSettlements.set({});
        this.invoiceHistoryError.set(true);
      },
    });
  }

  retryInvoiceHistory(): void {
    const patient = this.selectedPatient();
    if (patient) this.loadPatientHistory(patient.id);
  }
""",
              'History loader',
          )
          ts = replace_once(
              ts,
              "  openInvoiceDetails(invoice: Invoice): void { this.selectedInvoiceForEstimates.set(invoice); }\n  closeInvoiceDetails(): void { this.selectedInvoiceForEstimates.set(null); }\n",
              """  openInvoiceDetails(invoice: Invoice): void {
    this.selectedInvoiceForEstimates.set(invoice);
    this.zone.onStable.pipe(take(1)).subscribe(() => this.invoiceDetailsPanel?.nativeElement.focus());
  }

  closeInvoiceDetails(): void {
    const invoiceId = this.selectedInvoiceForEstimates()?.id;
    this.selectedInvoiceForEstimates.set(null);
    if (invoiceId) {
      this.zone.onStable.pipe(take(1)).subscribe(() => this.invoiceHistory?.focusInvoice(invoiceId));
    }
  }
""",
              'Detail focus methods',
          )
          Path(ts_path).write_text(ts, encoding='utf-8')

          html_path = 'web/src/app/clinic/billing/billing-management-page.component.html'
          html = from_main(html_path)
          html = replace_once(
              html,
              """              <app-billing-invoice-history
                [invoices]="invoices()"
                [settlements]="invoiceSettlements()"
                [translate]="translate"
                (printPdf)="printInvoicePdf($event)"
                (openPayment)="openPaymentModal($event)"
                (openInsurance)="openInsuranceFollowUp()"
                (selectInvoice)="openInvoiceDetails($event)"
              ></app-billing-invoice-history>
""",
              """              <app-billing-invoice-history
                [invoices]="invoices()"
                [settlements]="invoiceSettlements()"
                [loading]="invoiceHistoryLoading()"
                [error]="invoiceHistoryError()"
                [selectedInvoiceId]="selectedInvoiceForEstimates()?.id ?? null"
                [translate]="translate"
                (retry)="retryInvoiceHistory()"
                (printPdf)="printInvoicePdf($event)"
                (openPayment)="openPaymentModal($event)"
                (openInsurance)="openInsuranceFollowUp()"
                (selectInvoice)="openInvoiceDetails($event)"
              ></app-billing-invoice-history>
""",
              'History bindings',
          )
          html = replace_once(
              html,
              """    @if (selectedInvoiceForEstimates(); as selectedInvoice) {
      <div class="fixed inset-0 z-40 bg-black/40" (click)="closeInvoiceDetails()"></div>
      <aside class="fixed inset-y-0 right-0 z-50 w-full max-w-2xl overflow-y-auto bg-[var(--app-surface)] border-l border-[var(--app-border)] shadow-xl p-4 sm:p-6" role="dialog" aria-modal="true" aria-label="Détail de la facture">
        <div class="flex items-center justify-between gap-4 mb-5 pb-3 border-b border-[var(--app-border)]/60">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-brand-cyan">{{ t('billing.invoiceDetails', 'Détail de la facture') }}</p>
            <h2 class="text-base font-bold text-[var(--text-primary)]">{{ selectedInvoice.invoiceNumber }}</h2>
          </div>
          <button type="button" (click)="closeInvoiceDetails()" class="ui-button ui-button-secondary" [attr.aria-label]="t('common.aria.close', 'Fermer')">
            <app-ui-icon name="x-mark" />
            {{ t('billing.closeDetails', 'Fermer') }}
          </button>
        </div>
        <app-billing-estimates
          [patientId]="selectedPatient()!.id"
          [visits]="patientVisits()"
          [initialVisitId]="selectedVisitId()"
          [invoice]="selectedInvoice"
          [settlement]="invoiceSettlements()[selectedInvoice.id]"
          (close)="closeInvoiceDetails()"
        ></app-billing-estimates>
      </aside>
    }
""",
              """    @if (selectedInvoiceForEstimates(); as selectedInvoice) {
      <div class="fixed inset-0 z-40 bg-black/40" aria-hidden="true" (click)="closeInvoiceDetails()"></div>
      <aside
        #invoiceDetailsPanel
        tabindex="-1"
        class="fixed inset-y-0 right-0 z-50 w-full max-w-2xl overflow-y-auto bg-[var(--app-surface)] border-l border-[var(--app-border)] shadow-xl p-4 outline-none sm:p-6"
        role="dialog"
        aria-modal="true"
        aria-labelledby="invoice-details-title"
        (keydown.escape)="closeInvoiceDetails()"
      >
        <div class="flex items-center justify-between gap-4 mb-5 pb-3 border-b border-[var(--app-border)]/60">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-brand-cyan">{{ t('billing.invoiceDetails', 'Détail de la facture') }}</p>
            <h2 id="invoice-details-title" class="text-base font-bold text-[var(--text-primary)]">{{ selectedInvoice.invoiceNumber }}</h2>
          </div>
          <button type="button" (click)="closeInvoiceDetails()" class="ui-button ui-button-secondary" [attr.aria-label]="t('common.aria.close', 'Fermer')">
            <app-ui-icon name="x-mark" />
            {{ t('billing.closeDetails', 'Fermer') }}
          </button>
        </div>
        <app-billing-estimates
          [patientId]="selectedInvoice.patientId"
          [visits]="patientVisits()"
          [initialVisitId]="selectedInvoice.visitId ?? ''"
          [invoice]="selectedInvoice"
          [settlement]="invoiceSettlements()[selectedInvoice.id]"
          (close)="closeInvoiceDetails()"
        ></app-billing-estimates>
      </aside>
    }
""",
              'Accessible detail panel',
          )
          Path(html_path).write_text(html, encoding='utf-8')
          PY
      - name: Restore permanent pipeline
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit surgical parent diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/app/clinic/billing/billing-management-page.component.ts web/src/app/clinic/billing/billing-management-page.component.html .github/workflows/ci.yml
          git diff --cached --quiet || git commit -m "refactor(story-2202): limiter le diff du workspace parent"
          git push origin HEAD:feature/story-2202-invoice-workspace

  backend-build:
    name: Backend — Maven Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and verify (Maven strict)
        run: ./mvnw clean verify -B -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026

  frontend-build:
    name: Frontend Angular — Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Angular production
        run: npm run build