name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  backend-build:
    name: Backend — Maven Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and verify (Maven strict)
        run: ./mvnw clean verify -B -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026

  frontend-build:
    name: Frontend Angular — Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Angular production
        run: npm run build

  p0-documentation-closure:
    name: Documentation — Close P0 baseline
    if: github.event_name == 'pull_request' && github.head_ref == 'docs/p0-baseline-closure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/p0-baseline-closure
          fetch-depth: 0
      - name: Apply targeted documentation updates
        run: python scripts/temp_close_p0_docs.py
      - name: Restore permanent workflow and remove temporary files
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/temp-p0-doc-closure.yml scripts/temp_close_p0_docs.py
      - name: Commit closure documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/CHANGELOG.md docs/ai/PROJECT-TRACKING.md docs/ai/tickets .github/workflows/ci.yml .github/workflows/temp-p0-doc-closure.yml scripts/temp_close_p0_docs.py
          git commit -m "docs(p0): clôturer la baseline technique"
          git push origin HEAD:docs/p0-baseline-closure
