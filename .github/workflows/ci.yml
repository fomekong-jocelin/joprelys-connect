name: Joprelys Connect — STORY-2203 Changelog Finalization

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  finalize-changelog:
    if: github.actor != 'github-actions[bot]'
    name: STORY-2203 — Finalize changelog and restore CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-2203-cashier-collection-queue
          fetch-depth: 0

      - name: Insert STORY-2203 changelog entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ai/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = "- **Poste caissier simplifié et file d’encaissement (STORY-2203)** : ajout d’une file tenantée des factures patient réellement encaissables, triée par ancienneté, avec recherche et filtres, encaissement total ou partiel, contrôle de session active, référence obligatoire pour chèques/virements, reçu immédiat, rafraîchissement automatique, route dédiée au rôle `CAISSIER`, responsive light/dark, accessibilité clavier et traductions FR/EN.\n"
          if entry not in text:
              marker = '### Added\n\n'
              if marker not in text:
                  raise SystemExit('Section Added introuvable dans le changelog')
              text = text.replace(marker, marker + entry + '\n', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore permanent CI from main
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit finalized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/CHANGELOG.md .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(story-2203): ajouter l’entrée au changelog et restaurer la CI"
          git push origin HEAD:feature/story-2203-cashier-collection-queue
