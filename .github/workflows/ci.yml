name: STORY-2204 — Maintenance tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  align-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Align historical insurance workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          full = Path('backend/src/test/java/com/joprelys/backend/billing/FullFinancialE2ETest.java')
          text = full.read_text()
          if 'import java.math.BigDecimal;' not in text:
              text = text.replace('import java.time.Instant;', 'import java.math.BigDecimal;\nimport java.time.Instant;')
          replacements = {
              'LocalDate.now().plusDays(1), 80000.0);': 'LocalDate.now().plusDays(1), new BigDecimal("80000.0000"));',
              'LocalDate.now().plusDays(1), 8000.0);': 'LocalDate.now().plusDays(1), new BigDecimal("8000.0000"));',
              'LocalDate.now().plusDays(1), 5000.0);': 'LocalDate.now().plusDays(1), new BigDecimal("5000.0000"));',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing FullFinancial replacement: {old}')
              text = text.replace(old, new, 1)

          first_marker = '''        mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/send")
                          .header("Authorization", "Bearer " + tokenDaf))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/pay")'''
          first_replacement = '''        mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/send")
                          .header("Authorization", "Bearer " + tokenDaf))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/receive")
                          .header("Authorization", "Bearer " + tokenDaf)
                          .contentType(MediaType.APPLICATION_JSON)
                          .content("{\\"insurerReference\\":\\"AR-E2E-01\\"}"))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/accept")
                          .header("Authorization", "Bearer " + tokenDaf)
                          .contentType(MediaType.APPLICATION_JSON)
                          .content("{\\"acceptedAmount\\":80000,\\"insurerReference\\":\\"AR-E2E-01\\"}"))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/pay")'''
          if first_marker not in text:
              raise SystemExit('Missing first FullFinancial workflow marker')
          text = text.replace(first_marker, first_replacement, 1)

          daf_marker = '''        mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/send")
                          .header("Authorization", "Bearer " + tokenDaf))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/pay")'''
          daf_replacement = '''        mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/send")
                          .header("Authorization", "Bearer " + tokenDaf))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/receive")
                          .header("Authorization", "Bearer " + tokenDaf)
                          .contentType(MediaType.APPLICATION_JSON)
                          .content("{\\"insurerReference\\":\\"AR-TEST-DAF\\"}"))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/accept")
                          .header("Authorization", "Bearer " + tokenDaf)
                          .contentType(MediaType.APPLICATION_JSON)
                          .content("{\\"acceptedAmount\\":5000}"))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.getId() + "/pay")'''
          if daf_marker not in text:
              raise SystemExit('Missing DAF FullFinancial workflow marker')
          text = text.replace(daf_marker, daf_replacement, 1)
          full.write_text(text)

          cash = Path('backend/src/test/java/com/joprelys/backend/cash/CashRegisterControllerTest.java')
          text = cash.read_text()
          if 'import java.math.BigDecimal;' not in text:
              text = text.replace('import java.time.Instant;', 'import java.math.BigDecimal;\nimport java.time.Instant;')
          old_payment = 'new InsuranceBordereauController.BordereauPaymentRequest(80000.0, "CHQ-ASSUR-E2E");'
          new_payment = 'new InsuranceBordereauController.BordereauPaymentRequest(new BigDecimal("80000.0000"), "CHQ-ASSUR-E2E");'
          if old_payment not in text:
              raise SystemExit('Missing CashRegister payment constructor')
          text = text.replace(old_payment, new_payment, 1)

          cash_marker = '''        mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.id() + "/send")
                          .header("Authorization", "Bearer " + tokenAdmin))
                  .andExpect(status().isOk());

          // 9. Régler le bordereau par l'assurance (80 000 FCFA)'''
          cash_replacement = '''        mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.id() + "/send")
                          .header("Authorization", "Bearer " + tokenAdmin))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.id() + "/receive")
                          .header("Authorization", "Bearer " + tokenAdmin)
                          .contentType(MediaType.APPLICATION_JSON)
                          .content("{\\"insurerReference\\":\\"AR-CASH-E2E\\"}"))
                  .andExpect(status().isOk());

          mockMvc.perform(post("/api/billing/insurance-bordereaux/" + bordereau.id() + "/accept")
                          .header("Authorization", "Bearer " + tokenAdmin)
                          .contentType(MediaType.APPLICATION_JSON)
                          .content("{\\"acceptedAmount\\":80000}"))
                  .andExpect(status().isOk());

          // 9. Régler le bordereau par l'assurance (80 000 FCFA)'''
          if cash_marker not in text:
              raise SystemExit('Missing CashRegister workflow marker')
          text = text.replace(cash_marker, cash_replacement, 1)
          cash.write_text(text)
          PY
      - name: Restore permanent CI workflow
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml backend/src/test/java/com/joprelys/backend/billing/FullFinancialE2ETest.java backend/src/test/java/com/joprelys/backend/cash/CashRegisterControllerTest.java
          git commit -m "test(billing): aligner les parcours E2E assurance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
