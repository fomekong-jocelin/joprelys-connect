name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    name: Backend — Maven Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and verify (Maven strict)
        id: backend-verify
        shell: bash
        run: |
          set +e
          ./mvnw clean verify -B -Dspring.profiles.active=test > ../backend-build.log 2>&1
          status=$?
          tail -n 300 ../backend-build.log
          exit $status
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026
      - name: Upload backend diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-2204-backend-diagnostic
          path: backend-build.log
          if-no-files-found: error

  frontend-build:
    name: Frontend Angular — Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: frontend-tests
        shell: bash
        run: |
          set +e
          npm test > ../frontend-test.log 2>&1
          status=$?
          tail -n 300 ../frontend-test.log
          exit $status
      - name: Build Angular production
        if: success()
        shell: bash
        run: |
          set +e
          npm run build > ../frontend-build.log 2>&1
          status=$?
          tail -n 300 ../frontend-build.log
          exit $status
      - name: Upload frontend diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-2204-frontend-diagnostic
          path: |
            frontend-test.log
            frontend-build.log
          if-no-files-found: warn
