name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  story-2202-i18n:
    name: STORY-2202 — Apply FR/EN translations
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/story-2202-invoice-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/story-2202-invoice-workspace
          fetch-depth: 0
      - name: Add translation entries without reformatting JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          translations = {
              Path('web/src/assets/i18n/fr.json'): {
                  'common.retry': 'Réessayer',
                  'billing.invoiceHistoryHint': 'Consultez le reste à encaisser et la prochaine action disponible.',
                  'billing.invoiceCount': 'facture(s)',
                  'billing.invoiceHistoryLoading': 'Chargement des factures…',
                  'billing.invoiceHistoryError': 'Impossible de charger les factures de ce patient.',
                  'billing.patientRemaining': 'Reste patient',
                  'billing.insuranceRemaining': 'Reste assurance',
                  'billing.invoiceActions': 'Actions de la facture',
                  'billing.downloadInvoicePdf': 'Télécharger la facture en PDF',
                  'billing.noInvoicesHint': 'Sélectionnez une visite non facturée pour créer la première facture.',
                  'billing.collection.settled': 'Soldée',
                  'billing.collection.insuranceDue': 'Assurance à recouvrer',
                  'billing.collection.patientPartiallyPaid': 'Part patient partielle',
                  'billing.collection.patientDue': 'Part patient à régler',
                  'billing.collection.notYetDue': 'À valider',
                  'billing.collection.cancelled': 'Annulée',
                  'billing.invoiceTotal': 'Total',
                  'billing.invoicePatient': 'Part patient',
                  'billing.invoiceInsurance': 'Part assurance',
                  'billing.issuedAt': 'Émise le',
                  'billing.details': 'Détail',
                  'billing.collect': 'Encaisser',
                  'billing.followInsurance': "Suivre l’assurance",
                  'billing.payPatient': 'Encaisser la part patient',
                  'billing.insuranceCollectionHint': 'Part patient réglée. Part assurance à recouvrer via un bordereau.',
                  'billing.noInvoices': 'Aucune facture émise pour ce patient.',
              },
              Path('web/src/assets/i18n/en.json'): {
                  'common.retry': 'Retry',
                  'billing.invoiceHistoryHint': 'Review outstanding balances and the next available action.',
                  'billing.invoiceCount': 'invoice(s)',
                  'billing.invoiceHistoryLoading': 'Loading invoices…',
                  'billing.invoiceHistoryError': 'Unable to load invoices for this patient.',
                  'billing.patientRemaining': 'Patient balance',
                  'billing.insuranceRemaining': 'Insurance balance',
                  'billing.invoiceActions': 'Invoice actions',
                  'billing.downloadInvoicePdf': 'Download invoice as PDF',
                  'billing.noInvoicesHint': 'Select an unbilled visit to create the first invoice.',
                  'billing.collection.settled': 'Settled',
                  'billing.collection.insuranceDue': 'Insurance outstanding',
                  'billing.collection.patientPartiallyPaid': 'Patient partly paid',
                  'billing.collection.patientDue': 'Patient payment due',
                  'billing.collection.notYetDue': 'Pending validation',
                  'billing.collection.cancelled': 'Cancelled',
                  'billing.invoiceTotal': 'Total',
                  'billing.invoicePatient': 'Patient share',
                  'billing.invoiceInsurance': 'Insurance share',
                  'billing.issuedAt': 'Issued on',
                  'billing.details': 'Details',
                  'billing.collect': 'Collect',
                  'billing.followInsurance': 'Track insurance',
                  'billing.payPatient': 'Collect patient payment',
                  'billing.insuranceCollectionHint': 'The patient share is paid. Collect the insurance share through a statement.',
                  'billing.noInvoices': 'No invoice has been issued for this patient.',
              },
          }

          for path, entries in translations.items():
              text = path.read_text(encoding='utf-8')
              missing = [(key, value) for key, value in entries.items() if f'"{key}"' not in text]
              if not missing:
                  continue
              anchor = next(
                  line for line in text.splitlines(keepends=True)
                  if '"billing.error.save"' in line
              )
              insertion = ''.join(
                  f'  {json.dumps(key, ensure_ascii=False)}: {json.dumps(value, ensure_ascii=False)},\n'
                  for key, value in missing
              )
              text = text.replace(anchor, anchor + insertion, 1)
              json.loads(text)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Restore permanent pipeline
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/assets/i18n/fr.json web/src/assets/i18n/en.json .github/workflows/ci.yml
          git diff --cached --quiet || git commit -m "feat(story-2202): ajouter les traductions FR et EN"
          git push origin HEAD:feature/story-2202-invoice-workspace

  backend-build:
    name: Backend — Maven Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build and verify (Maven strict)
        run: ./mvnw clean verify -B -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026

  frontend-build:
    name: Frontend Angular — Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Angular production
        run: npm run build