name: Joprelys Connect — Cash Closeout Documentation Finalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-documentation:
    if: github.actor != 'github-actions[bot]'
    name: Finalize cash closeout documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/cash-register-history-closeout-report
          fetch-depth: 0

      - name: Insert changelog entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ai/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = "- **Clôture de caisse — historique et bordereau PDF (BUG-20260710-CASH-CLOSEOUT-HISTORY-REPORT)** : rétablissement des espacements entre cartes, ajout de l’historique personnel tenanté des sessions, rafraîchissement et mise en évidence après clôture, détail différé des mouvements, bordereau PDF numéroté avec rapprochement financier, contrôles propriétaire/DAF/Admin et couverture backend/Angular.\n"
          marker = "### Fixed\n\n"
          if 'BUG-20260710-CASH-CLOSEOUT-HISTORY-REPORT' not in text:
              if marker not in text:
                  raise SystemExit('Section Fixed introuvable dans le changelog')
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore permanent CI
        shell: bash
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit finalized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/CHANGELOG.md .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(cash): finaliser le changelog de clôture"
          git push origin HEAD:fix/cash-register-history-closeout-report