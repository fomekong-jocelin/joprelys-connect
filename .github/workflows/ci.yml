name: Joprelys Connect — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    name: Backend — Maven Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and verify (Maven strict)
        id: backend_verify
        continue-on-error: true
        run: ./mvnw clean verify -B -Dspring.profiles.active=test > backend-build.log 2>&1
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026
      - name: Upload backend diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-diagnostic
          path: backend/backend-build.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce backend result
        if: steps.backend_verify.outcome == 'failure'
        run: exit 1

  frontend-build:
    name: Frontend Angular — Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: frontend_tests
        continue-on-error: true
        run: npm test -- --run > frontend-tests.log 2>&1
      - name: Upload frontend diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-diagnostic
          path: web/frontend-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce frontend test result
        if: steps.frontend_tests.outcome == 'failure'
        run: exit 1
      - name: Build Angular production
        run: npm run build
