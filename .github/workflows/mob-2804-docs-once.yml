name: MOB-2804 docs once

on:
  push:
    branches:
      - feat/mob-2804-mobile-network

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mob-2804-mobile-network
          fetch-depth: 0
      - name: Apply documented replacements
        run: python3 .github/scripts/update_mob2804_docs.py
      - name: Commit and remove temporary automation
        run: |
          rm .github/scripts/update_mob2804_docs.py
          rm .github/workflows/mob-2804-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/CHANGELOG.md docs/ai/PROJECT-TRACKING.md .github/scripts/update_mob2804_docs.py .github/workflows/mob-2804-docs-once.yml
          git commit -m "docs(mobile): clôturer le suivi MOB-2804"
          git push origin HEAD:feat/mob-2804-mobile-network
