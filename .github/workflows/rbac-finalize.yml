name: Restore permanent RBAC CI

on:
  push:
    branches:
      - feature/admin-managed-rbac

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-managed-rbac
          fetch-depth: 0
      - name: Restore permanent workflow and remove maintenance file
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: Joprelys Connect — CI Pipeline

          on:
            push:
              branches: [main, develop]
            pull_request:
              branches: [main, develop]

          jobs:
            backend-build:
              name: Backend — Maven Build & Tests
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: backend
              steps:
                - name: Checkout code
                  uses: actions/checkout@v4
                - name: Set up Java 21
                  uses: actions/setup-java@v4
                  with:
                    java-version: '21'
                    distribution: 'temurin'
                    cache: 'maven'
                - name: Ensure Maven wrapper is executable
                  run: chmod +x mvnw
                - name: Build and verify (Maven strict)
                  run: ./mvnw clean verify -B -Dspring.profiles.active=test
                  env:
                    SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
                    JOPRELYS_JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-2026

            frontend-build:
              name: Frontend Angular — Build & Tests
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: web
              steps:
                - name: Checkout code
                  uses: actions/checkout@v4
                - name: Set up Node.js 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: 'npm'
                    cache-dependency-path: web/package-lock.json
                - name: Install dependencies
                  run: npm ci
                - name: Run tests
                  run: npm test
                - name: Build Angular production
                  run: npm run build
          YAML
          rm -f .github/workflows/rbac-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/rbac-finalize.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: restaurer le pipeline permanent après diagnostic RBAC"
          git push origin HEAD:feature/admin-managed-rbac
