name: Temporary clinical voice UX hotfix

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.pull_request.head.ref == 'agent/restore-instant-ai-dictation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply capture-first UX corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          service_path = Path('mobile/lib/features/dashboard/application/clinical_speech_service.dart')
          service = service_path.read_text()

          service = replace_once(
              service,
              '  final ClinicalDictationParser _parser = const ClinicalDictationParser();\n',
              '  final ClinicalDictationParser _parser = const ClinicalDictationParser();\n  ClinicalAiState? _savedAiState;\n',
              'saved AI state field',
          )

          restore_pattern = re.compile(
              r'  void _restoreExistingSession\(ClinicalAiState existing\) \{.*?\n  \}\n\n  void _replaceSegmentsWithTranscript',
              re.S,
          )
          restore_replacement = '''  void _restoreExistingSession(ClinicalAiState existing) {
            final pending = existing.pendingTranscript?.trim();
            final transcript = pending?.isNotEmpty == true
                ? pending!
                : existing.transcript?.trim();
            final hasSavedAnalysis =
                existing.revisions.isNotEmpty ||
                existing.hasAcceptedChanges ||
                existing.needsClarification ||
                !existing.noteFrom(includePending: true).isEmpty ||
                !existing.vitalsFrom(includePending: true).isEmpty;

            _savedAiState = hasSavedAnalysis ? existing : null;
            if (transcript?.isNotEmpty == true) {
              _replaceSegmentsWithTranscript(transcript!);
            }

            value = value.copyWith(
              status: _segments.isEmpty
                  ? SpeechStatus.idle
                  : SpeechStatus.transcriptReview,
              stage: ClinicalVoiceStage.capture,
              transcript: clinicalTranscriptFromSegments(_segments),
              segments: List<ClinicalTranscriptSegment>.unmodifiable(_segments),
              vitals: const PatientVitals(),
              note: const ConsultationNote(),
              revisions: const <ClinicalAiRevision>[],
              needsClarification: false,
              hasSavedAnalysis: hasSavedAnalysis,
              clearPartial: true,
              clearAssistant: true,
              clearError: true,
            );
          }

          void _replaceSegmentsWithTranscript'''
          service, count = restore_pattern.subn(restore_replacement, service, count=1)
          if count != 1:
              raise RuntimeError('restore existing session block not found')

          segment_pattern = re.compile(
              r'  void _replaceSegmentsWithTranscript\(String transcript\) \{.*?\n  \}\n\n  Future<void> startRealtimeListening',
              re.S,
          )
          segment_replacement = '''  void _replaceSegmentsWithTranscript(String transcript) {
            final normalized = transcript.replaceAll('\\r\\n', '\\n').trim();
            final texts = <String>[];
            for (final paragraph in normalized.split(RegExp(r'\\n+'))) {
              final value = paragraph.trim();
              if (value.isEmpty) continue;
              var start = 0;
              for (final match in RegExp(r'[.!?]+(?:\\s+|$)').allMatches(value)) {
                final sentence = value.substring(start, match.end).trim();
                if (sentence.isNotEmpty) texts.add(sentence);
                start = match.end;
              }
              final tail = value.substring(start).trim();
              if (tail.isNotEmpty) texts.add(tail);
            }
            if (texts.isEmpty && normalized.isNotEmpty) texts.add(normalized);

            _segments
              ..clear()
              ..addAll([
                for (var index = 0; index < texts.length; index++)
                  ClinicalTranscriptSegment(
                    id: 'restored-${DateTime.now().microsecondsSinceEpoch}-$index',
                    offset: Duration(seconds: index * 2),
                    text: texts[index],
                  ),
              ]);
            _captureStartedAt ??= DateTime.now();
          }

          Future<void> startRealtimeListening'''
          service, count = segment_pattern.subn(segment_replacement, service, count=1)
          if count != 1:
              raise RuntimeError('restore transcript segmentation block not found')

          service = replace_once(
              service,
              '    _captureStartedAt ??= DateTime.now();\n    _shouldKeepListening = true;\n',
              '    _invalidateSavedAnalysis();\n    _captureStartedAt ??= DateTime.now();\n    _shouldKeepListening = true;\n',
              'invalidate old analysis when recording resumes',
          )

          service = replace_once(
              service,
              '  void _publishReviewedTranscript() {\n    final transcript = clinicalTranscriptFromSegments(_segments);\n',
              '  void _publishReviewedTranscript() {\n    _savedAiState = null;\n    final transcript = clinicalTranscriptFromSegments(_segments);\n',
              'invalidate analysis after editing',
          )
          service = replace_once(
              service,
              '      needsClarification: false,\n      clearPartial: true,\n',
              '      needsClarification: false,\n      hasSavedAnalysis: false,\n      clearPartial: true,\n',
              'clear saved analysis after editing',
          )
          service = replace_once(
              service,
              '    _captureStartedAt = null;\n    try {\n',
              '    _captureStartedAt = null;\n    _savedAiState = null;\n    try {\n',
              'clear saved analysis with transcript',
          )
          service = replace_once(
              service,
              '  void _applyAiState(ClinicalAiState state) {\n    final aiVitals = state.vitalsFrom(includePending: true);\n',
              '  void _applyAiState(ClinicalAiState state) {\n    _savedAiState = state;\n    final aiVitals = state.vitalsFrom(includePending: true);\n',
              'cache applied analysis',
          )
          service = replace_once(
              service,
              '      needsClarification: state.needsClarification,\n    );\n  }\n\n  Future<void> _setAwake',
              '''      needsClarification: state.needsClarification,
              hasSavedAnalysis: true,
            );
          }

          void _invalidateSavedAnalysis() {
            _savedAiState = null;
            value = value.copyWith(
              vitals: const PatientVitals(),
              note: const ConsultationNote(),
              revisions: const <ClinicalAiRevision>[],
              needsClarification: false,
              hasSavedAnalysis: false,
              clearAssistant: true,
            );
          }

          void showSavedAnalysis() {
            final saved = _savedAiState;
            if (_disposed || saved == null) return;
            _applyAiState(saved);
          }

          void returnToTranscript() {
            if (_disposed) return;
            value = value.copyWith(
              status: _segments.isEmpty
                  ? SpeechStatus.idle
                  : SpeechStatus.transcriptReview,
              stage: ClinicalVoiceStage.capture,
              transcript: clinicalTranscriptFromSegments(_segments),
              segments: List<ClinicalTranscriptSegment>.unmodifiable(_segments),
              soundLevel: 0,
              clearPartial: true,
              clearError: true,
            );
          }

          Future<void> continueDictation() async {
            if (_disposed) return;
            returnToTranscript();
            await startRealtimeListening();
          }

          Future<void> startFreshDictation() async {
            if (_disposed) return;
            await clearTranscript();
            if (!_disposed) await startRealtimeListening();
          }

          Future<void> _setAwake''',
              'capture/review navigation methods',
          )
          service_path.write_text(service)

          state_path = Path('mobile/lib/features/dashboard/application/clinical_voice_state.dart')
          state = state_path.read_text()
          state = replace_once(
              state,
              '    this.needsClarification = false,\n  });\n',
              '    this.needsClarification = false,\n    this.hasSavedAnalysis = false,\n  });\n',
              'state constructor saved analysis',
          )
          state = replace_once(
              state,
              '  final bool needsClarification;\n\n  bool get hasPendingProposals',
              '  final bool needsClarification;\n  final bool hasSavedAnalysis;\n\n  bool get hasPendingProposals',
              'state saved analysis field',
          )
          state = replace_once(
              state,
              '    bool? needsClarification,\n    bool clearError = false,\n',
              '    bool? needsClarification,\n    bool? hasSavedAnalysis,\n    bool clearError = false,\n',
              'copyWith saved analysis parameter',
          )
          state = replace_once(
              state,
              '      needsClarification: needsClarification ?? this.needsClarification,\n    );\n',
              '      needsClarification: needsClarification ?? this.needsClarification,\n      hasSavedAnalysis: hasSavedAnalysis ?? this.hasSavedAnalysis,\n    );\n',
              'copyWith saved analysis value',
          )
          state_path.write_text(state)

          l10n_path = Path('mobile/lib/features/dashboard/presentation/clinical_voice_localizations.dart')
          l10n = l10n_path.read_text()
          l10n = replace_once(
              l10n,
              "  String get voiceDeleteSegment => _voiceIsFrench ? 'Supprimer' : 'Delete';\n\n",
              """  String get voiceDeleteSegment => _voiceIsFrench ? 'Supprimer' : 'Delete';

            String get voiceContinueDictation =>
                _voiceIsFrench ? 'Continuer la dictée' : 'Continue dictation';
            String get voiceEditTranscript =>
                _voiceIsFrench ? 'Modifier la transcription' : 'Edit transcript';
            String get voiceStartFreshDictation =>
                _voiceIsFrench ? 'Nouvelle dictée' : 'New dictation';
            String get voiceStartFreshTitle => _voiceIsFrench
                ? 'Commencer une nouvelle dictée ?'
                : 'Start a new dictation?';
            String get voiceStartFreshBody => _voiceIsFrench
                ? 'La transcription et la synthèse actuelles seront supprimées avant le nouvel enregistrement.'
                : 'The current transcript and summary will be deleted before the new recording.';
            String get voiceSavedAnalysisTitle => _voiceIsFrench
                ? 'Synthèse précédente disponible'
                : 'Previous summary available';
            String get voiceSavedAnalysisBody => _voiceIsFrench
                ? 'La transcription reste prioritaire. Vous pouvez consulter l’ancienne synthèse sans perdre le texte.'
                : 'The transcript remains primary. You can view the previous summary without losing the text.';
            String get voiceViewSavedAnalysis =>
                _voiceIsFrench ? 'Voir la synthèse' : 'View summary';

""",
              'new UX translations',
          )
          l10n_path.write_text(l10n)

          sheet_path = Path('mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart')
          sheet = sheet_path.read_text()

          sheet = replace_once(
              sheet,
              '    if (confirmed == true) await _speechService.clearTranscript();\n  }\n\n  Future<void> _applyAcceptedResult',
              '''    if (confirmed == true) await _speechService.clearTranscript();
          }

          Future<void> _startFresh() async {
            final l10n = AppLocalizations.of(context);
            final confirmed = await showDialog<bool>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: Text(l10n.voiceStartFreshTitle),
                content: Text(l10n.voiceStartFreshBody),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.of(dialogContext).pop(false),
                    child: Text(l10n.voiceCancel),
                  ),
                  FilledButton.icon(
                    onPressed: () => Navigator.of(dialogContext).pop(true),
                    icon: const Icon(Icons.mic_rounded),
                    label: Text(l10n.voiceStartFreshDictation),
                  ),
                ],
              ),
            );
            if (confirmed == true) await _speechService.startFreshDictation();
          }

          Future<void> _continueDictation() => _speechService.continueDictation();

          Future<void> _applyAcceptedResult''',
              'fresh/continue parent actions',
          )

          sheet = replace_once(
              sheet,
              '                          onClearAll: _clearAll,\n                          onAnalyze: _speechService.analyzeTranscript,\n',
              '                          onClearAll: _clearAll,\n                          onStartFresh: _startFresh,\n                          onShowSavedAnalysis: _speechService.showSavedAnalysis,\n                          onAnalyze: _speechService.analyzeTranscript,\n',
              'capture callbacks',
          )
          sheet = replace_once(
              sheet,
              '                          onRevisionDecision: _speechService.decideRevision,\n                          onApply: _applyAcceptedResult,\n',
              '                          onRevisionDecision: _speechService.decideRevision,\n                          onEditTranscript: _speechService.returnToTranscript,\n                          onContinueDictation: _continueDictation,\n                          onStartFresh: _startFresh,\n                          onApply: _applyAcceptedResult,\n',
              'review callbacks',
          )

          sheet = replace_once(
              sheet,
              '    required this.onClearAll,\n    required this.onAnalyze,\n',
              '    required this.onClearAll,\n    required this.onStartFresh,\n    required this.onShowSavedAnalysis,\n    required this.onAnalyze,\n',
              'capture constructor callbacks',
          )
          sheet = replace_once(
              sheet,
              '  final VoidCallback onClearAll;\n  final VoidCallback onAnalyze;\n',
              '  final VoidCallback onClearAll;\n  final VoidCallback onStartFresh;\n  final VoidCallback onShowSavedAnalysis;\n  final VoidCallback onAnalyze;\n',
              'capture callback fields',
          )
          sheet = replace_once(
              sheet,
              '            startLabel: l10n.assistantStartDictation,\n',
              '            startLabel: state.hasTranscript\n                ? l10n.voiceContinueDictation\n                : l10n.assistantStartDictation,\n',
              'dynamic dictation label',
          )
          sheet = replace_once(
              sheet,
              '          if (processing) ...[\n',
              '''          if (state.hasSavedAnalysis && !listening && !processing) ...[
            const SizedBox(height: 14),
            _SavedAnalysisCard(onOpen: onShowSavedAnalysis),
          ],
          if (processing) ...[
''',
              'saved analysis card in capture',
          )

          old_actions = '''            Row(
              children: [
                Expanded(
                  child: OutlinedButton.icon(
                    onPressed: onClearAll,
                    icon: const Icon(Icons.delete_sweep_outlined),
                    label: Text(l10n.voiceClearAll),
                  ),
                ),
                const SizedBox(width: 10),
                Expanded(
                  flex: 2,
                  child: FilledButton.icon(
                    onPressed: onAnalyze,
                    icon: const Icon(Icons.auto_awesome_rounded),
                    label: Text(l10n.voiceAnalyzeAction),
                  ),
                ),
              ],
            ),
'''
          new_actions = '''            FilledButton.icon(
              onPressed: onAnalyze,
              icon: const Icon(Icons.auto_awesome_rounded),
              label: Text(l10n.voiceAnalyzeAction),
            ),
            const SizedBox(height: 8),
            Row(
              children: [
                Expanded(
                  child: OutlinedButton.icon(
                    onPressed: onStartFresh,
                    icon: const Icon(Icons.mic_none_rounded),
                    label: Text(l10n.voiceStartFreshDictation),
                  ),
                ),
                const SizedBox(width: 8),
                Expanded(
                  child: TextButton.icon(
                    onPressed: onClearAll,
                    icon: const Icon(Icons.delete_sweep_outlined),
                    label: Text(l10n.voiceClearAll),
                  ),
                ),
              ],
            ),
'''
          sheet = replace_once(sheet, old_actions, new_actions, 'capture action layout')

          sheet = replace_once(
              sheet,
              'class _ReviewPhase extends StatelessWidget {\n',
              '''class _SavedAnalysisCard extends StatelessWidget {
            const _SavedAnalysisCard({required this.onOpen});

            final VoidCallback onOpen;

            @override
            Widget build(BuildContext context) {
              final l10n = AppLocalizations.of(context);
              final colors = Theme.of(context).colorScheme;
              return Container(
                padding: const EdgeInsets.all(14),
                decoration: BoxDecoration(
                  color: colors.secondaryContainer.withValues(alpha: 0.36),
                  borderRadius: BorderRadius.circular(AppDesignTokens.radiusMd),
                  border: Border.all(color: colors.secondary.withValues(alpha: 0.35)),
                ),
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Icon(Icons.history_rounded, color: colors.secondary),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            l10n.voiceSavedAnalysisTitle,
                            style: Theme.of(context).textTheme.labelLarge?.copyWith(
                              fontWeight: FontWeight.w900,
                            ),
                          ),
                          const SizedBox(height: 3),
                          Text(
                            l10n.voiceSavedAnalysisBody,
                            style: Theme.of(context).textTheme.bodySmall,
                          ),
                          const SizedBox(height: 8),
                          TextButton.icon(
                            onPressed: onOpen,
                            icon: const Icon(Icons.fact_check_outlined),
                            label: Text(l10n.voiceViewSavedAnalysis),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _ReviewPhase extends StatelessWidget {
''',
              'saved analysis card widget',
          )

          sheet = replace_once(
              sheet,
              '    required this.onRevisionDecision,\n    required this.onApply,\n',
              '    required this.onRevisionDecision,\n    required this.onEditTranscript,\n    required this.onContinueDictation,\n    required this.onStartFresh,\n    required this.onApply,\n',
              'review constructor navigation actions',
          )
          sheet = replace_once(
              sheet,
              '  final RevisionDecisionCallback onRevisionDecision;\n  final VoidCallback onApply;\n',
              '  final RevisionDecisionCallback onRevisionDecision;\n  final VoidCallback onEditTranscript;\n  final VoidCallback onContinueDictation;\n  final VoidCallback onStartFresh;\n  final VoidCallback onApply;\n',
              'review navigation action fields',
          )

          review_anchor = '''          if (processing) ...[
            const SizedBox(height: 16),
            const Center(child: CircularProgressIndicator()),
          ],
'''
          review_actions = '''          const SizedBox(height: 12),
          OutlinedButton.icon(
            onPressed: processing ? null : onEditTranscript,
            icon: const Icon(Icons.edit_note_rounded),
            label: Text(l10n.voiceEditTranscript),
          ),
          const SizedBox(height: 8),
          FilledButton.icon(
            onPressed: processing ? null : onContinueDictation,
            icon: const Icon(Icons.mic_rounded),
            label: Text(l10n.voiceContinueDictation),
          ),
          TextButton.icon(
            onPressed: processing ? null : onStartFresh,
            icon: const Icon(Icons.refresh_rounded),
            label: Text(l10n.voiceStartFreshDictation),
          ),
          if (processing) ...[
            const SizedBox(height: 16),
            const Center(child: CircularProgressIndicator()),
          ],
'''
          # Only replace the occurrence inside _ReviewPhase by operating on its suffix.
          review_index = sheet.index('class _ReviewPhase extends StatelessWidget')
          prefix, suffix = sheet[:review_index], sheet[review_index:]
          suffix = replace_once(suffix, review_anchor, review_actions, 'review navigation controls')
          sheet = prefix + suffix
          sheet_path.write_text(sheet)

          test_path = Path('mobile/test/clinical_voice_capture_first_ux_test.dart')
          test_path.write_text('''import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:joprelys_connect/features/dashboard/application/clinical_voice_state.dart';
          import 'package:joprelys_connect/features/dashboard/domain/consultation_note.dart';
          import 'package:joprelys_connect/features/dashboard/domain/patient_vitals.dart';

          void main() {
            test('saved analysis is explicit state and never changes the capture stage', () {
              const state = RealtimeSpeechState(
                status: SpeechStatus.transcriptReview,
                stage: ClinicalVoiceStage.capture,
                transcript: 'Céphalées persistantes.',
                segments: <ClinicalTranscriptSegment>[],
                partialTranscript: '',
                partialOffset: Duration.zero,
                vitals: PatientVitals(),
                note: ConsultationNote(),
                revisions: [],
                hasSavedAnalysis: true,
              );

              expect(state.stage, ClinicalVoiceStage.capture);
              expect(state.hasSavedAnalysis, isTrue);
              expect(state.copyWith(hasSavedAnalysis: false).hasSavedAnalysis, isFalse);
            });

            test('restoring a server session cannot force the synthesis screen', () {
              final source = File(
                'lib/features/dashboard/application/clinical_speech_service.dart',
              ).readAsStringSync();
              final start = source.indexOf('void _restoreExistingSession');
              final end = source.indexOf('void _replaceSegmentsWithTranscript');
              final restoreBlock = source.substring(start, end);

              expect(restoreBlock, contains('stage: ClinicalVoiceStage.capture'));
              expect(restoreBlock, isNot(contains('_applyAiState(existing)')));
              expect(restoreBlock, contains('hasSavedAnalysis: hasSavedAnalysis'));
            });

            test('both capture and review expose recovery actions', () {
              final source = File(
                'lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart',
              ).readAsStringSync();

              expect(source, contains('voiceEditTranscript'));
              expect(source, contains('voiceContinueDictation'));
              expect(source, contains('voiceStartFreshDictation'));
              expect(source, contains('onShowSavedAnalysis'));
            });
          }
          ''')

      - name: Validate Flutter application
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Commit validated UX correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile/lib/features/dashboard/application/clinical_speech_service.dart \
            mobile/lib/features/dashboard/application/clinical_voice_state.dart \
            mobile/lib/features/dashboard/presentation/clinical_voice_localizations.dart \
            mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart \
            mobile/test/clinical_voice_capture_first_ux_test.dart
          git diff --cached --quiet || git commit -m "fix(mobile): keep clinical voice capture first"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
