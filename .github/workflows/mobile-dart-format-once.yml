name: MOB-2803 one-shot Dart format

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 251
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Format Dart sources
        run: dart format mobile/lib mobile/test
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "style(mobile): appliquer dart format MOB-2803"
          git push origin HEAD:${{ github.head_ref }}
