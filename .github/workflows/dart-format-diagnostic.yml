name: Dart format diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Print Dart formatter diff
        shell: bash
        run: |
          dart format lib test
          git diff -- lib/features/dashboard/application/cloud_speech_streaming_service.dart
