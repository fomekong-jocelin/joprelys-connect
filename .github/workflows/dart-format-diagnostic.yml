name: Apply Dart formatting

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  format-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stabilize WebSocket generation and format Dart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/dashboard/application/cloud_speech_streaming_service.dart')
          text = path.read_text(encoding='utf-8')
          before = """    _connecting = true;
              final generation = ++_connectionGeneration;
              await _cleanupWebSocket();
          """
          after = """    _connecting = true;
              await _cleanupWebSocket();
              final generation = ++_connectionGeneration;
          """
          if before in text:
              text = text.replace(before, after, 1)
          text = text.replace(
              "  Future<void> _cleanupWebSocket() async {\n    _connectionGeneration += 1;\n",
              "  Future<void> _cleanupWebSocket() async {\n",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib test
      - name: Commit formatted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/dashboard/application/cloud_speech_streaming_service.dart
          if git diff --cached --quiet; then
            echo "Source déjà formatée."
            exit 0
          fi
          git commit -m "style(mobile): formater et stabiliser le moteur vocal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
