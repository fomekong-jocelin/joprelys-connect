name: Run AI voice surgical fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/mobile-voice-clinical-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-voice-clinical-safety
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Execute embedded patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/apply-ai-voice-surgical-fix.yml').read_text(encoding='utf-8')
          start = workflow.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          function_start = script.index('def replace_once(path, old, new):')
          function_end = script.index('\n\n# ------------------------------------------------------------------', function_start)
          flexible = '''def replace_once(path, old, new):
    content = read(path)
    if old in content:
        write(path, content.replace(old, new, 1))
        return
    tokens = re.split(r'\\s+', old.strip())
    pattern = r'\\s+'.join(re.escape(token) for token in tokens)
    match = re.search(pattern, content, flags=re.S)
    if match is None:
        raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
    write(path, content[:match.start()] + new + content[match.end():])
'''
          script = script[:function_start] + flexible + script[function_end:]
          exec(compile(script, 'embedded-ai-voice-fix.py', 'exec'))
          PY
      - name: Format Dart
        working-directory: mobile
        run: dart format lib test
      - name: Commit surgical fix and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-ai-voice-surgical-fix.yml
          rm -f .github/workflows/run-ai-voice-surgical-fix.yml
          rm -f .ci-trigger-ai-voice-surgical-fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend mobile .github/workflows .ci-trigger-ai-voice-surgical-fix
          git commit -m "fix(ai-voice): traiter les anomalies de recette"
          git push origin HEAD:fix/mobile-voice-clinical-safety
