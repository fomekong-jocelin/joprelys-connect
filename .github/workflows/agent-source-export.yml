name: Agent source export

on:
  push:
    branches:
      - agent/fix-ai-pairing-and-consultation-state
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='**/target' \
            --exclude='**/node_modules' \
            --exclude='**/dist' \
            -czf "$RUNNER_TEMP/joprelys-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-source-export
          path: ${{ runner.temp }}/joprelys-source.tar.gz
          if-no-files-found: error
          retention-days: 1
