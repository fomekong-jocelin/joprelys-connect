name: Agent finalize root fix

on:
  push:
    branches:
      - agent/fix-ai-pairing-and-consultation-state

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ai-pairing-and-consultation-state
          fetch-depth: 0
      - name: Restore explicit consultation not-found test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/test/java/com/joprelys/backend/consultation/api/ConsultationControllerTest.java')
          content = path.read_text()
          old = '''\t@Test
          \tvoid givenNoConsultation_whenGetConsultation_thenNoContent() throws Exception {
          \t\tmockMvc.perform(get("/api/visits/" + visitA.getId() + "/consultation")
          \t\t\t\t.header("Authorization", "Bearer " + tokenMedecinA))
          \t\t\t\t.andExpect(status().isNoContent());
          \t}
          '''
          new = '''\t@Test
          \tvoid givenNoConsultation_whenGetConsultation_thenNotFound() throws Exception {
          \t\tmockMvc.perform(get("/api/visits/" + visitA.getId() + "/consultation")
          \t\t\t\t.header("Authorization", "Bearer " + tokenMedecinA))
          \t\t\t\t.andExpect(status().isNotFound())
          \t\t\t\t.andExpect(jsonPath("$.detail").value("Aucune consultation trouvée pour cette visite."));
          \t}
          '''
          if old not in content:
              raise SystemExit('Expected consultation test block was not found')
          path.write_text(content.replace(old, new))
          PY
          rm .github/workflows/agent-source-export.yml
          git diff --check
      - name: Commit final source-only diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/test/java/com/joprelys/backend/consultation/api/ConsultationControllerTest.java .github/workflows/agent-source-export.yml
          git commit -m "test(consultation): assert explicit missing resource"
          git push origin HEAD:agent/fix-ai-pairing-and-consultation-state
