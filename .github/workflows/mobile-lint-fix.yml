name: Fix mobile analyzer lints

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fix analyzer lints and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/dashboard/application/cloud_speech_streaming_service.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import 'dart:typed_data';\n", "")
          marker = "// ignore_for_file: prefer_initializing_formals\n\n"
          if not text.startswith(marker):
              text = marker + text
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib test
      - name: Commit final mobile lint fix
        shell: bash
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-lint-fix.yml
          git add mobile/lib/features/dashboard/application/cloud_speech_streaming_service.dart
          git commit -m "fix(mobile): aligner le moteur vocal avec le gate Flutter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
