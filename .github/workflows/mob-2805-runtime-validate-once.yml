name: MOB-2805 runtime validation once

on:
  push:
    branches:
      - feat/mob-2805-mobile-auth

permissions:
  contents: write

concurrency:
  group: mob-2805-runtime-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Validate and persist proof
        shell: bash
        run: |
          set +e
          VALIDATED_SHA="$(git rev-parse HEAD)"
          LOG="$GITHUB_WORKSPACE/mob-2805-runtime-validation.log"
          STATUS=0

          run_step() {
            local label="$1"
            shift
            echo "=== $label ===" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            local code=$?
            echo "exit_code=$code" >> "$LOG"
            echo >> "$LOG"
            if [ "$code" -ne 0 ]; then
              STATUS="$code"
            fi
          }

          cd mobile
          run_step "flutter pub get" flutter pub get
          run_step "dart format" dart format --output=none --set-exit-if-changed lib test
          run_step "flutter analyze" flutter analyze
          run_step "flutter test" flutter test
          run_step "flutter build apk --debug" flutter build apk --debug
          cd "$GITHUB_WORKSPACE"

          rm .github/workflows/mob-2805-runtime-validate-once.yml
          rm -f .ci/mob-2805-runtime-trigger
          rm -f .ci/mob-2805-runtime-success.txt
          rm -f .ci/mob-2805-runtime-validation.log
          mkdir -p .ci

          if [ "$STATUS" -eq 0 ]; then
            {
              echo "validated_head=$VALIDATED_SHA"
              echo "flutter_version=3.44.6"
              echo "pub_get=success"
              echo "format=success"
              echo "analyze=success"
              echo "tests=success"
              echo "apk_debug=success"
            } > .ci/mob-2805-runtime-success.txt
            rm -f "$LOG"
          else
            mv "$LOG" .ci/mob-2805-runtime-validation.log
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows .ci
          if [ "$STATUS" -eq 0 ]; then
            git commit -m "test(mobile): consigner la validation runtime MOB-2805"
          else
            git commit -m "test(mobile): consigner les erreurs runtime MOB-2805"
          fi
          git push origin HEAD:feat/mob-2805-mobile-auth
          exit 0
