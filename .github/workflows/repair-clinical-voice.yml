name: Repair clinical voice capture

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.ref == 'agent/restore-instant-ai-dictation' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-instant-ai-dictation
          fetch-depth: 0

      - name: Restore repair script
        shell: bash
        run: |
          mkdir -p tools
          python - <<'PY'
          import base64, gzip
          data = ''
          payload = gzip.decompress(base64.b64decode(data))
          open('tools/repair_clinical_voice_capture.py', 'wb').write(payload)
          PY

      - name: Apply offline-first capture repair
        run: python tools/repair_clinical_voice_capture.py

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format repaired Dart files
        working-directory: mobile
        run: dart format lib test

      - name: Commit repaired implementation
        shell: bash
        run: |
          git config user.name 'Joprelys CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(mobile): make clinical dictation offline-first and deduplicate speech' || exit 0
          git push origin HEAD:agent/restore-instant-ai-dictation
