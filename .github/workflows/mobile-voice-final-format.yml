name: Final mobile voice format

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/mobile-voice-clinical-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-voice-clinical-safety
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Format final voice files
        working-directory: mobile
        run: |
          dart format \
            lib/features/dashboard/application/clinical_speech_service.dart \
            lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart \
            lib/features/dashboard/presentation/widgets/patient_vitals_sheet.dart
      - name: Commit formatted files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mobile-voice-final-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile .github/workflows/mobile-voice-final-format.yml
          git commit -m "style(mobile): formater les correctifs vocaux finaux"
          git push origin HEAD:fix/mobile-voice-clinical-safety
