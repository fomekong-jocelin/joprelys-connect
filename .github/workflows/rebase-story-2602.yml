name: Rebuild STORY-2602 on main

on:
  push:
    branches:
      - repair/story-2602-rebased

permissions:
  contents: write

jobs:
  rebuild:
    name: Apply STORY-2602 delta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/story-2602-rebased
          fetch-depth: 0

      - name: Apply only STORY-2602 changes on top of merged main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/story-2602-doctor-availability
          git diff --binary 4d2eadc3fc63c2f8e57c18920f3d8d98d1c61af9 698556ae5cdf21853001c97a1cdc37dc417cdaed > /tmp/story-2602.patch
          git apply --index --3way /tmp/story-2602.patch
          rm .github/workflows/rebase-story-2602.yml
          git add -A
          git commit -m "feat(appointment): gestion des disponibilités médecin (STORY-2602)"
          git push origin HEAD:repair/story-2602-rebased
