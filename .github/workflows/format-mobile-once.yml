name: Format mobile branch once

on:
  push:
    branches:
      - feat/mobile-premium-patient-record
    paths:
      - '.github/workflows/format-mobile-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-premium-patient-record
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format mobile sources and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          dart format lib test
          cd ..
          git rm .github/workflows/format-mobile-once.yml

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib mobile/test
          git commit -m 'style(mobile): apply Dart formatter'
          git push origin HEAD:feat/mobile-premium-patient-record
