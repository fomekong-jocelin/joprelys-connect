name: Update mobile dashboard golden once

on:
  push:
    branches:
      - feat/mobile-premium-patient-record
    paths:
      - '.github/workflows/update-mobile-dashboard-golden-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-premium-patient-record
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Restore stable scroll key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mobile/lib/features/foundation/presentation/pages/foundation_page.dart')
          text = path.read_text()
          old = "key: const PageStorageKey('professional-dashboard-scroll'),"
          new = "key: const ValueKey('professional-dashboard-scroll'),"
          if old not in text:
              raise SystemExit('Expected dashboard PageStorageKey not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Update deterministic dashboard golden
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          flutter pub get
          dart format lib test
          flutter test --update-goldens test/auth_ui_golden_test.dart
          cd ..
          git rm .github/workflows/update-mobile-dashboard-golden-once.yml

      - name: Commit final visual baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib mobile/test/goldens
          git commit -m 'test(mobile): update premium dashboard golden'
          git push origin HEAD:feat/mobile-premium-patient-record
