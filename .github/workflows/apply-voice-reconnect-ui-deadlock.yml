name: Apply voice reconnect deadlock fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]
    paths:
      - '.github/workflows/apply-voice-reconnect-ui-deadlock.yml'
      - 'scripts/apply_voice_reconnect_fix.py'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-reconnect-ui-deadlock
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply fail-safe voice transport changes
        run: python3 scripts/apply_voice_reconnect_fix.py
      - name: Validate Flutter
        working-directory: mobile
        shell: bash
        run: |
          flutter pub get
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile docs/ai/tickets/BUG-20260806-VOICE-RECONNECT-UI-DEADLOCK.md
          git commit -m "fix(mobile): garantir la sortie des reconnexions vocales"
          git push origin HEAD:fix/voice-reconnect-ui-deadlock
