name: Apply STORY-2603 time policy

on:
  push:
    branches:
      - feature/story-2603-patient-appointments

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/story-2603-patient-appointments
      - name: Use pure cancellation policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/main/java/com/joprelys/backend/appointment/application/DefaultPatientAppointmentService.java')
          text = path.read_text()
          old = '''\t\tInstant deadline = appointment.getStartAt()
          \t\t\t\t.minus(Duration.ofHours(properties.patientCancelDeadlineHours()));
          \t\tif (Instant.now().isAfter(deadline)) {
          \t\t\tthrow cancelDeadlinePassed();
          \t\t}
          '''
          new = '''\t\tif (!AppointmentTimePolicy.canPatientCancel(
          \t\t\t\tappointment.getStartAt(),
          \t\t\t\tInstant.now(),
          \t\t\t\tproperties.patientCancelDeadlineHours())) {
          \t\t\tthrow cancelDeadlinePassed();
          \t\t}
          '''
          if old not in text:
              raise SystemExit('Cancellation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/story-2603-time-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(appointment): appliquer la policy d’annulation testable"
          git push origin HEAD:feature/story-2603-patient-appointments
