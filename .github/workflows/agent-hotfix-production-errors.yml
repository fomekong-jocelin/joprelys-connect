name: Agent hotfix production errors

on:
  push:
    branches:
      - agent/fix-ai-production-errors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ai-production-errors
          fetch-depth: 0

      - name: Apply controlled patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one occurrence, found {count}')
              file_path.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'web/src/app/shared/layout/app-shell-nav.component.ts',
              """    const canReadAdmissions = this.rbacApi.hasPermission('PATIENT_READ')
                || this.rbacApi.hasPermission('PATIENT_WRITE');
""",
              """    const canReadAdmissions = this.rbacApi.hasPermission('PATIENT_WRITE');
""",
          )

          replace_once(
              'backend/src/main/java/com/joprelys/backend/consultation/application/ConsultationService.java',
              """\t@Transactional(readOnly = true)
\tpublic ConsultationResponse getDetailedConsultationByVisitId(UUID visitId) {
\t\tvar c = consultationRepository.findByVisitId(visitId)
\t\t\t\t.orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"Aucune consultation trouvée pour cette visite.\"));
\t\tvar doc = medicalDocumentRepository.findByVisitId(visitId).orElse(null);
\t\tvar vitals = VitalsResponse.fromEntity(c.getVisit().getVitals());
\t\tvar prescriptionOpt = prescriptionRepository.findByConsultationId(c.getId());
\t\tvar prescriptionItems = prescriptionOpt
\t\t\t\t.map(p -> p.getItems().stream()
\t\t\t\t\t\t.map(PrescriptionItemResponse::fromEntity)
\t\t\t\t\t\t.toList())
\t\t\t\t.orElse(List.of());
\t\treturn ConsultationResponse.fromEntity(c, doc, vitals, prescriptionItems, prescriptionOpt.orElse(null));
\t}
""",
              """\t@Transactional(readOnly = true)
\tpublic Optional<ConsultationResponse> findDetailedConsultationByVisitId(UUID visitId) {
\t\treturn consultationRepository.findByVisitId(visitId)
\t\t\t\t.map(c -> {
\t\t\t\t\tvar doc = medicalDocumentRepository.findByVisitId(visitId).orElse(null);
\t\t\t\t\tvar vitals = VitalsResponse.fromEntity(c.getVisit().getVitals());
\t\t\t\t\tvar prescriptionOpt = prescriptionRepository.findByConsultationId(c.getId());
\t\t\t\t\tvar prescriptionItems = prescriptionOpt
\t\t\t\t\t\t\t.map(p -> p.getItems().stream()
\t\t\t\t\t\t\t\t\t.map(PrescriptionItemResponse::fromEntity)
\t\t\t\t\t\t\t\t\t.toList())
\t\t\t\t\t\t\t.orElse(List.of());
\t\t\t\t\treturn ConsultationResponse.fromEntity(
\t\t\t\t\t\t\tc, doc, vitals, prescriptionItems, prescriptionOpt.orElse(null));
\t\t\t\t});
\t}

\t@Transactional(readOnly = true)
\tpublic ConsultationResponse getDetailedConsultationByVisitId(UUID visitId) {
\t\treturn findDetailedConsultationByVisitId(visitId)
\t\t\t\t.orElseThrow(() -> new ResponseStatusException(
\t\t\t\t\t\tHttpStatus.NOT_FOUND,
\t\t\t\t\t\t\"Aucune consultation trouvée pour cette visite.\"));
\t}
""",
          )

          replace_once(
              'backend/src/main/java/com/joprelys/backend/consultation/api/ConsultationController.java',
              'import org.springframework.http.HttpStatus;\n',
              'import org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\n',
          )

          replace_once(
              'backend/src/main/java/com/joprelys/backend/consultation/api/ConsultationController.java',
              """    public ConsultationResponse getConsultation(
            @Parameter(description = \"Identifiant de la visite\") @PathVariable UUID id) {
""",
              """    public ResponseEntity<ConsultationResponse> getConsultation(
            @Parameter(description = \"Identifiant de la visite\") @PathVariable UUID id) {
""",
          )

          replace_once(
              'backend/src/main/java/com/joprelys/backend/consultation/api/ConsultationController.java',
              """            return consultationService.getDetailedConsultationByVisitId(id);
""",
              """            return consultationService.findDetailedConsultationByVisitId(id)
                    .map(ResponseEntity::ok)
                    .orElseGet(() -> ResponseEntity.noContent().build());
""",
          )

          replace_once(
              'web/src/app/consultation/consultation-api.service.ts',
              """  getConsultation(visitId: string): Observable<Consultation> {
""",
              """  getConsultation(visitId: string): Observable<Consultation | null> {
""",
          )

          replace_once(
              'web/src/app/consultation/consultation.component.ts',
              """      next: (existing) => {
        this.consultation.set(existing);
""",
              """      next: (existing) => {
        if (!existing) return;
        this.consultation.set(existing);
""",
          )

          replace_once(
              'web/src/app/consultation/voice-assistant-panel.component.ts',
              """import { Subscription, interval } from 'rxjs';
""",
              """import { Subscription, finalize, interval } from 'rxjs';
""",
          )

          replace_once(
              'web/src/app/consultation/voice-assistant-panel.component.ts',
              """  private pollingSubscription: Subscription | null = null;
""",
              """  private pollingSubscription: Subscription | null = null;
  private sessionRefreshInFlight = false;
  private nextSessionRefreshAt = 0;
""",
          )

          replace_once(
              'web/src/app/consultation/voice-assistant-panel.component.ts',
              """  private refreshSession(silent = false): void {
    this.http.get<AiSessionResponse | null>(
      `/api/ai/consultations/${this.visitId}/session`,
    ).subscribe({
      next: response => {
        if (response) this.session.set(response);
      },
      error: error => {
        if (!silent && error.status !== 404) this.handleError(error, 'Assistant IA indisponible.');
      },
    });
  }
""",
              """  private refreshSession(silent = false): void {
    if (this.sessionRefreshInFlight) return;
    if (silent && Date.now() < this.nextSessionRefreshAt) return;

    this.sessionRefreshInFlight = true;
    this.http.get<AiSessionResponse | null>(
      `/api/ai/consultations/${this.visitId}/session`,
    ).pipe(
      finalize(() => this.sessionRefreshInFlight = false),
    ).subscribe({
      next: response => {
        this.nextSessionRefreshAt = 0;
        if (response) this.session.set(response);
      },
      error: error => {
        if ((error.status ?? 0) >= 500) {
          this.nextSessionRefreshAt = Date.now() + 30_000;
        }
        if (!silent && error.status !== 404) this.handleError(error, 'Assistant IA indisponible.');
      },
    });
  }
""",
          )

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/joprelys/backend/consultation/application/ConsultationService.java \
                  backend/src/main/java/com/joprelys/backend/consultation/api/ConsultationController.java \
                  web/src/app/shared/layout/app-shell-nav.component.ts \
                  web/src/app/consultation/consultation-api.service.ts \
                  web/src/app/consultation/consultation.component.ts \
                  web/src/app/consultation/voice-assistant-panel.component.ts
          git commit -m "fix(ui): eliminate expected production console errors"
          git push origin HEAD:agent/fix-ai-production-errors
