name: Temporary mobile lint fixer

on:
  push:
    branches:
      - fix/mobile-cloud-speech-progressive-contract

permissions:
  contents: write

jobs:
  fix-mobile-lints:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-cloud-speech-progressive-contract
          fetch-depth: 0

      - name: Apply targeted lint fixes
        shell: python
        run: |
          from pathlib import Path

          cloud = Path('mobile/lib/features/dashboard/application/cloud_speech_streaming_service.dart')
          text = cloud.read_text(encoding='utf-8')
          directive = '// ignore_for_file: prefer_initializing_formals\n\n'
          if not text.startswith('// ignore_for_file: prefer_initializing_formals'):
              cloud.write_text(directive + text, encoding='utf-8')

          coordinator = Path('mobile/lib/features/dashboard/application/clinical_voice_progressive_coordinator.dart')
          text = coordinator.read_text(encoding='utf-8')
          text = text.replace("import 'clinical_voice_state.dart';\n", '')
          coordinator.write_text(text, encoding='utf-8')

          sheet = Path('mobile/lib/features/dashboard/presentation/widgets/clinical_voice_progressive_assistant_sheet.dart')
          text = sheet.read_text(encoding='utf-8')
          text = text.replace("import '../../application/clinical_speech_service.dart';\n", '')
          sheet.write_text(text, encoding='utf-8')

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format mobile sources
        run: dart format mobile/lib mobile/test

      - name: Commit lint fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          if git diff --cached --quiet; then
            echo "No lint fix required."
            exit 0
          fi
          git commit -m "fix(mobile): résoudre les lints du streaming vocal"
          git push origin HEAD:fix/mobile-cloud-speech-progressive-contract
