name: PR 289 repair

on:
  push:
    branches:
      - feat/lab-item-workflow

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feat/lab-item-workflow
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format the three files reported by CI
        working-directory: mobile
        run: |
          dart format \
            lib/features/dashboard/presentation/lab_localizations.dart \
            lib/features/dashboard/presentation/widgets/patient_record_laboratory_item_section.dart \
            test/lab_order_api_test.dart

      - name: Renumber the colliding Flyway migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('backend/src/main/java/db/migration'),
              Path('backend/src/main/resources/db/migration'),
          ]
          source = roots[0] / 'V95__lab_order_item_workflow.java'
          if not source.exists():
              print('Lab workflow migration already renumbered; nothing to do.')
              raise SystemExit(0)

          versions = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('V*__*'):
                  if path == source:
                      continue
                  match = re.match(r'V(\d+)__', path.name)
                  if match:
                      versions.append(int(match.group(1)))

          next_version = max(versions, default=95) + 1
          target = source.with_name(f'V{next_version}__lab_order_item_workflow.java')
          if target.exists():
              raise SystemExit(f'Refusing to overwrite existing migration: {target}')

          content = source.read_text(encoding='utf-8')
          content = content.replace(
              'class V95__lab_order_item_workflow',
              f'class V{next_version}__lab_order_item_workflow',
              1,
          )
          target.write_text(content, encoding='utf-8')
          source.unlink()
          print(f'Renumbered lab workflow migration to V{next_version}.')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile backend/src/main/java/db/migration
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): repair PR 289 gates"
          git push origin HEAD:feat/lab-item-workflow
