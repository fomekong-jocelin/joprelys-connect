name: MOB-2803 one-shot tracking fix

on:
  push:
    branches:
      - feat/mob-2803-mobile-i18n

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mob-2803-mobile-i18n
          fetch-depth: 0
      - name: Restore unrelated HOS-RBAC tracking row
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/ai/PROJECT-TRACKING.md')
          text = path.read_text(encoding='utf-8')
          wrong = "| HOS-RBAC-001-D | EPIC-0027 / HOS-RBAC-001 | Breaking cleanup sécurité + migration DB | Supprimer définitivement `HOSPITALIZATION_MANAGE` | Spring Boot / Flyway / PostgreSQL / Angular QA | DONE — issue #121 / PR #122 / Flyway V86 / CI #1027 verte | P0 | 2 | Senior backend sécurité + DBA | 0.5–1.0j | 1.0–1.5j | Non recommandé seul | GPT-5.6 Thinking | Tech Lead + RSSI/DBA | SPRINT-0014 | Terminé | Suivi post-fusion ; aucune réintroduction legacy | Faible | 2026-07-23 |"
          correct = "| HOS-RBAC-001-D | EPIC-0027 / HOS-RBAC-001 | Breaking cleanup sécurité + migration DB | Supprimer définitivement `HOSPITALIZATION_MANAGE` | Spring Boot / Flyway / PostgreSQL / Angular QA | DONE — issue #121 / PR #122 / Flyway V86 / CI #1027 verte | P0 | 2 | Senior backend sécurité + DBA | 0.5–1.0j | 1.0–1.5j | Non recommandé seul | GPT-5.6 Thinking | Tech Lead + RSSI/DBA | SPRINT-0014 (phase 0) | Terminé | Suivi post-fusion ; aucune réintroduction legacy | Faible | 2026-07-23 |"
          if wrong not in text:
              raise SystemExit('Expected erroneous row not found; refusing broad rewrite')
          path.write_text(text.replace(wrong, correct, 1), encoding='utf-8')
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai/PROJECT-TRACKING.md
          git commit -m "docs: restaurer le suivi HOS-RBAC inchangé"
          git push origin HEAD:feat/mob-2803-mobile-i18n
