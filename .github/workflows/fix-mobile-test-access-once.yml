name: Fix mobile test access once

on:
  push:
    branches:
      - feat/mobile-premium-patient-record
    paths:
      - '.github/workflows/fix-mobile-test-access-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-premium-patient-record
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Inject deterministic RBAC access into dashboard tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('mobile/test/auth_ui_golden_test.dart'),
              Path('mobile/test/dashboard_mobile_layout_test.dart'),
              Path('mobile/test/widget_test.dart'),
          ]
          auth_import = "import 'package:joprelys_mobile/features/auth/application/auth_controller.dart';"
          access_imports = """import 'package:joprelys_mobile/features/auth/application/auth_controller.dart';
          import 'package:joprelys_mobile/features/auth/application/effective_access_controller.dart';
          import 'package:joprelys_mobile/features/auth/domain/effective_access.dart';"""
          locale_override = "      platformLocaleProvider.overrideWithValue(const Locale('fr'))," 
          access_override = """      platformLocaleProvider.overrideWithValue(const Locale('fr')),
                effectiveAccessProvider.overrideWith(
                  (ref) async => const EffectiveAccess(
                    userId: 'fixture-user',
                    roles: {'CLINICAL_TEST'},
                    permissions: {'VISIT_READ'},
                  ),
                ),"""

          for path in files:
              text = path.read_text()
              if 'effective_access_controller.dart' not in text:
                  if auth_import not in text:
                      raise SystemExit(f'Missing auth import in {path}')
                  text = text.replace(auth_import, access_imports, 1)
              if 'fixture-user' not in text:
                  if locale_override not in text:
                      raise SystemExit(f'Missing locale override in {path}')
                  text = text.replace(locale_override, access_override, 1)
              path.write_text(text)
          PY

      - name: Format and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          dart format test
          cd ..
          git rm .github/workflows/fix-mobile-test-access-once.yml

      - name: Commit test harness updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/test
          git commit -m 'test(mobile): inject effective access in dashboard harnesses'
          git push origin HEAD:feat/mobile-premium-patient-record
