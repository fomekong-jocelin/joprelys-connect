name: Temporary mobile test alignment

on:
  push:
    branches:
      - fix/mobile-cloud-speech-progressive-contract

permissions:
  contents: write

jobs:
  align-mobile-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-cloud-speech-progressive-contract
          fetch-depth: 0

      - name: Align capture contract and structural test
        shell: python
        run: |
          from pathlib import Path

          sheet = Path('mobile/lib/features/dashboard/presentation/widgets/consultation_notes_sheet.dart')
          text = sheet.read_text(encoding='utf-8')
          old = 'initialDraft: _controllers.toAiDraft(),'
          new = 'initialDraft: const <String, String>{},'
          if old not in text:
              raise SystemExit(f'Expected consultation launch pattern not found: {old}')
          sheet.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('mobile/test/clinical_voice_progressive_flow_test.dart')
          text = test.read_text(encoding='utf-8')
          old = "'await _captureGateway.analyzeProgressiveSegment(',"
          new = "'.analyzeProgressiveSegment(',"
          if old not in text:
              raise SystemExit(f'Expected progressive analysis assertion not found: {old}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format changed sources
        run: dart format mobile/lib mobile/test

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          if git diff --cached --quiet; then
            echo "No contract alignment required."
            exit 0
          fi
          git commit -m "fix(mobile): démarrer une capture SOAP propre"
          git push origin HEAD:fix/mobile-cloud-speech-progressive-contract
