name: Apply clinical voice capture-first UX

on:
  push:
    branches:
      - agent/restore-instant-ai-dictation
    paths:
      - '.github/workflows/kick-clinical-voice-ux.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-instant-ai-dictation
          fetch-depth: 0

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Execute prepared UX correction
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/hotfix-clinical-voice-ux.yml').read_text()
          marker = '      - name: Apply capture-first UX corrections\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Validate Flutter application', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(dedent(script), 'clinical_voice_ux_hotfix.py', 'exec'))

      - name: Validate Flutter application
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Commit validated UX correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile/lib/features/dashboard/application/clinical_speech_service.dart \
            mobile/lib/features/dashboard/application/clinical_voice_state.dart \
            mobile/lib/features/dashboard/presentation/clinical_voice_localizations.dart \
            mobile/lib/features/dashboard/presentation/widgets/clinical_voice_assistant_sheet.dart \
            mobile/test/clinical_voice_capture_first_ux_test.dart
          git diff --cached --quiet || git commit -m "fix(mobile): keep clinical voice capture first"
          git push origin HEAD:agent/restore-instant-ai-dictation
