name: Hotfix voice lint normalization

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  normalize-voice-lints:
    if: ${{ github.event.pull_request.head.ref == 'fix/mobile-clinical-voice-progressive-sync' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply analyzer-safe imports and public constructor exception
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          coordinator = Path('mobile/lib/features/dashboard/application/clinical_voice_progressive_coordinator.dart')
          text = coordinator.read_text(encoding='utf-8')
          marker = '// ignore_for_file: prefer_initializing_formals\n\n'
          if not text.startswith(marker):
              text = marker + text
          text = text.replace("import 'clinical_voice_error_message.dart';\n", '')
          text = text.replace("import 'clinical_voice_state.dart';\n", '')
          coordinator.write_text(text, encoding='utf-8')

          sheet = Path('mobile/lib/features/dashboard/presentation/widgets/clinical_voice_progressive_assistant_sheet.dart')
          text = sheet.read_text(encoding='utf-8')
          text = text.replace("import '../../application/clinical_voice_state.dart';\n", '')
          sheet.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit lint normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No lint normalization required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/features/dashboard/application/clinical_voice_progressive_coordinator.dart \
                  mobile/lib/features/dashboard/presentation/widgets/clinical_voice_progressive_assistant_sheet.dart
          git commit -m 'style(mobile): satisfy progressive voice analyzer lints'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
