name: MOB-2805 validate once

on:
  push:
    branches:
      - feat/mob-2805-mobile-auth

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mob-2805-mobile-auth
          fetch-depth: 0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Validate and persist result
        shell: bash
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/mob-2805-validation.log"
          cd mobile
          {
            echo '=== flutter pub get ==='
            flutter pub get
            echo '=== dart format ==='
            dart format --output=none --set-exit-if-changed lib test
            echo '=== flutter analyze ==='
            flutter analyze
            echo '=== flutter test ==='
            flutter test
            echo '=== flutter build apk --debug ==='
            flutter build apk --debug
          } > "$LOG" 2>&1
          STATUS=$?
          cd "$GITHUB_WORKSPACE"

          rm .github/workflows/mob-2805-validate-once.yml
          rm -f .ci/mob-2805-validation.log
          if [ "$STATUS" -ne 0 ]; then
            mkdir -p .ci
            mv "$LOG" .ci/mob-2805-validation.log
          else
            rm -f "$LOG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mob-2805-validate-once.yml .ci/mob-2805-validation.log
          if [ "$STATUS" -eq 0 ]; then
            git commit -m "test(mobile): valider le runtime MOB-2805"
          else
            git commit -m "test(mobile): consigner les erreurs runtime MOB-2805"
          fi
          git push origin HEAD:feat/mob-2805-mobile-auth
          exit 0
