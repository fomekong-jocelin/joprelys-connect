name: Format mobile clinical details once

on:
  push:
    branches:
      - fix/mobile-patient-record-clinical-details
    paths:
      - '.github/workflows/format-mobile-clinical-details-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-patient-record-clinical-details
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Format changed Dart files
        working-directory: mobile
        run: |
          dart format \
            lib/features/dashboard/data/patient_history_api.dart \
            lib/features/dashboard/data/patient_record_api.dart \
            lib/features/dashboard/domain/patient_history.dart \
            lib/features/dashboard/presentation/widgets/patient_record_consultations_section.dart \
            lib/features/dashboard/presentation/widgets/patient_record_laboratory_section.dart \
            lib/features/dashboard/presentation/widgets/patient_record_navigation.dart \
            test/patient_record_clinical_sections_test.dart
      - name: Remove one-shot workflow and commit formatting
        run: |
          git rm .github/workflows/format-mobile-clinical-details-once.yml
          git config user.name "Joprelys AI Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(mobile): appliquer dart format au détail clinique"
          git push origin HEAD:fix/mobile-patient-record-clinical-details
