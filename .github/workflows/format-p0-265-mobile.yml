name: Temporary P0-265 Mobile Formatter

on:
  pull_request:
    branches: [main]
    types: [synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.ref == 'feat/p0-265-realtime-transcription' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/p0-265-realtime-transcription
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Resolve, format and update lockfile
        working-directory: mobile
        run: |
          flutter pub get
          dart format \
            lib/features/dashboard/application/clinical_realtime_transcription_bridge.dart \
            lib/features/dashboard/application/clinical_speech_service.dart \
            test/clinical_realtime_speech_service_test.dart

      - name: Commit exact formatted sources and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-p0-265-mobile.yml
          git add \
            mobile/lib/features/dashboard/application/clinical_realtime_transcription_bridge.dart \
            mobile/lib/features/dashboard/application/clinical_speech_service.dart \
            mobile/test/clinical_realtime_speech_service_test.dart \
            mobile/pubspec.lock \
            mobile/linux/flutter/generated_plugin_registrant.cc \
            mobile/linux/flutter/generated_plugins.cmake \
            mobile/macos/Flutter/GeneratedPluginRegistrant.swift \
            mobile/windows/flutter/generated_plugin_registrant.cc \
            mobile/windows/flutter/generated_plugins.cmake
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(mobile): formater le transport realtime"
          git push origin HEAD:feat/p0-265-realtime-transcription
