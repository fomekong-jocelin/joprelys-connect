name: Format mobile lab PR 287

on:
  push:
    branches:
      - feat/mobile-lab-results-workflow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-lab-results-workflow
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Format mobile
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(mobile): format lab workflow'
          git push origin HEAD:feat/mobile-lab-results-workflow
