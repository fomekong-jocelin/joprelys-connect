name: MOB-2804 format fixes once

on:
  push:
    branches:
      - feat/mob-2804-mobile-network

permissions:
  contents: write

jobs:
  format-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mob-2804-mobile-network
          fetch-depth: 0
      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Resolve and format
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/mob-2804-format-fixes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test mobile/pubspec.lock .github/workflows/mob-2804-format-fixes-once.yml
          git commit -m "style(mobile): formater les correctifs MOB-2804"
          git push origin HEAD:feat/mob-2804-mobile-network
