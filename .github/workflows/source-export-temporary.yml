name: Temporary source export

on:
  push:
    branches:
      - agent/voice-assistant-qr-ui

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf joprelys-source.tar.gz frontend backend docs .github package.json 2>/dev/null || tar --exclude=.git -czf joprelys-source.tar.gz frontend backend docs .github
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: temporary-source-export
          path: joprelys-source.tar.gz
          retention-days: 1
