name: Temporary source export

on:
  push:
    branches:
      - agent/voice-assistant-qr-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar -czf /tmp/joprelys-source.tar.gz web backend docs .github
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: temporary-source-export
          path: /tmp/joprelys-source.tar.gz
          retention-days: 1
