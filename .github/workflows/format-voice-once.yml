name: Format voice patch once

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/format-voice-once.yml'
      - 'mobile/lib/features/dashboard/application/cloud_speech_streaming_service.dart'
      - 'mobile/lib/features/dashboard/application/cloud_speech_streaming_health.dart'
      - 'mobile/test/cloud_speech_streaming_health_test.dart'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/voice-long-session-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/voice-long-session-stability
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply official Dart formatting
        working-directory: mobile
        run: |
          dart format \
            lib/features/dashboard/application/cloud_speech_streaming_service.dart \
            lib/features/dashboard/application/cloud_speech_streaming_health.dart \
            test/cloud_speech_streaming_health_test.dart

      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-voice-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib mobile/test
          git commit -m 'style(voice): appliquer le format Dart officiel'
          git push origin HEAD:fix/voice-long-session-stability
