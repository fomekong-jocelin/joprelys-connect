name: Wire STORY-2603 Angular feature

on:
  push:
    branches:
      - feature/story-2603-patient-appointments

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/story-2603-patient-appointments
      - name: Wire routes, navigation and i18n
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          i18n = Path('web/src/app/core/i18n/i18n.service.ts')
          text = i18n.read_text()
          text = text.replace(
              "        availability: this.optionalDictionary(`/assets/i18n/features/availability/${lang}.json`),\n",
              "        availability: this.optionalDictionary(`/assets/i18n/features/availability/${lang}.json`),\n        appointments: this.optionalDictionary(`/assets/i18n/features/appointments/${lang}.json`),\n",
              1,
          )
          text = text.replace(
              "        ...dictionaries.availability,\n",
              "        ...dictionaries.availability,\n        ...dictionaries.appointments,\n",
              1,
          )
          i18n.write_text(text)

          routes = Path('web/src/app/app.routes.ts')
          text = routes.read_text()
          marker = """  {
              path: 'patient/profile',
              loadComponent: () => import('./patient/portal/pages/patient-profile-page.component').then(m => m.PatientProfilePageComponent),
          """
          insertion = """  {
              path: 'patient/appointments',
              loadComponent: () => import('./patient/portal/appointments/patient-appointments-page.component').then(m => m.PatientAppointmentsPageComponent),
              canActivate: [roleGuard],
              data: { expectedRoles: ['PATIENT'], title: 'title.patient.appointments' },
            },
            {
              path: 'patient/profile',
              loadComponent: () => import('./patient/portal/pages/patient-profile-page.component').then(m => m.PatientProfilePageComponent),
          """
          if marker not in text:
              raise SystemExit('Patient profile route marker not found')
          routes.write_text(text.replace(marker, insertion, 1))

          nav = Path('web/src/app/shared/layout/app-shell-nav.component.ts')
          text = nav.read_text()
          marker = "      addUniqueItem(this.item('/patient/dashboard', 'menu.patientDashboard', 'chart-bar'));\n"
          replacement = marker + "      addUniqueItem(this.item('/patient/appointments', 'menu.patientAppointments', 'calendar'));\n"
          if marker not in text:
              raise SystemExit('Patient nav marker not found')
          nav.write_text(text.replace(marker, replacement, 1))

          page = Path('web/src/app/patient/portal/appointments/patient-appointments-page.component.ts')
          text = page.read_text()
          text = text.replace(
              "                      [class.border-[var(--brand-primary)]]=\"selectedDoctor()?.doctorId === doctor.doctorId\"\n                      [class.bg-[var(--brand-primary-subtle)]]=\"selectedDoctor()?.doctorId === doctor.doctorId\"\n                      [class.border-[var(--app-border)]]=\"selectedDoctor()?.doctorId !== doctor.doctorId\"\n                      [class.bg-[var(--app-surface-muted)]]=\"selectedDoctor()?.doctorId !== doctor.doctorId\"\n",
              "                      [style.border-color]=\"selectedDoctor()?.doctorId === doctor.doctorId ? 'var(--brand-primary)' : 'var(--app-border)'\"\n                      [style.background]=\"selectedDoctor()?.doctorId === doctor.doctorId ? 'var(--brand-primary-subtle)' : 'var(--app-surface-muted)'\"\n",
              1,
          )
          page.write_text(text)
          PY
          rm .github/workflows/story-2603-angular-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(appointment): brancher le portail patient dans Angular"
          git push origin HEAD:feature/story-2603-patient-appointments
