name: Temporary mobile format commit

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-commit:
    if: github.head_ref == 'fix/mobile-voice-clinical-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Resolve and format mobile sources
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
      - name: Remove temporary CI helpers
        run: |
          rm -f .github/workflows/mobile-format-export.yml
          rm -f mobile/.voice-safety-ci-trigger
      - name: Commit formatted sources and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile .github/workflows/mobile-format-export.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "style(mobile): formater le correctif vocal et verrouiller les dépendances"
          git push origin "HEAD:${{ github.head_ref }}"
