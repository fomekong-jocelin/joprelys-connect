name: Fix mobile analysis once

on:
  push:
    branches:
      - feat/mobile-premium-patient-record
    paths:
      - '.github/workflows/fix-mobile-analysis-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-premium-patient-record
          fetch-depth: 0
          persist-credentials: true

      - name: Apply analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('mobile/lib/features/dashboard/presentation/widgets/patient_record_sections.dart'): {
                  'Icons.clinical_notes_rounded': 'Icons.description_rounded',
                  'Icons.stethoscope_rounded': 'Icons.medical_services_outlined',
              },
              Path('mobile/lib/features/foundation/presentation/pages/workspace_profile_page.dart'): {
                  'l10n.dashboardProfileTitle': 'l10n.profileWorkspaceTitle',
              },
              Path('mobile/test/effective_access_test.dart'): {
                  'package:joprelys_connect/': 'package:joprelys_mobile/',
              },
              Path('mobile/test/patient_record_domain_test.dart'): {
                  'package:joprelys_connect/': 'package:joprelys_mobile/',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Missing expected text {old!r} in {path}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Format and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          dart format lib test
          cd ..
          git rm .github/workflows/fix-mobile-analysis-once.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib mobile/test
          git commit -m 'fix(mobile): resolve Flutter analyzer findings'
          git push origin HEAD:feat/mobile-premium-patient-record
