spring:
  datasource:
    url: jdbc:h2:mem:joprelys-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

joprelys:
  eco:
    source-tenant: clinique-demo
    identity:
      issuer-uri: https://joprelys-id.test/realms/joprelys-id
      jwk-set-uri: https://joprelys-id.test/realms/joprelys-id/protocol/openid-connect/certs
      audience: joprelys-api
    applications:
      "[allopharma-mobile]": allopharma
      "[allopharma-server]": allopharma
    webhooks:
      subscribers:
        allopharma:
          url: http://localhost:9/api/eco/v1/webhooks
          secret: ci-test-eco-webhook-secret-not-for-production
      outbox:
        relay-enabled: false
  web:
    base-url: https://joprelys.com
  security:
    prescription-pin-key: test-prescription-pin-key-at-least-32-chars
    patient-qr-key: test-patient-qr-key-at-least-32-characters
    jwt:
      secret: test-jwt-secret-for-joprelys-connect-32
      issuer: joprelys-connect-test
      audience: joprelys-clinic-test
      ttl-minutes: 30
