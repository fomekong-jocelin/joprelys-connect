spring:
  application:
    name: joprelys-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/joprelys}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
      pool-name: JoprelysHikariPool
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:2000000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
  flyway:
    enabled: true
    validate-on-migrate: false
    repair-on-migrate: true
  mail:
    host: ${MAIL_HOST:mail.joprelys.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@joprelys.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}

joprelys:
  web:
    base-url: ${JOPRELYS_WEB_BASE_URL:https://joprelys.com}
  ai:
    enabled: ${JOPRELYS_AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    speech-provider: ${SPEECH_PROVIDER:openai}
    session-ttl-minutes: ${AI_SESSION_TTL_MINUTES:30}
    max-conversation-turns: ${AI_MAX_CONVERSATION_TURNS:20}
    locale: ${AI_LOCALE:fr}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1}
      transcribe-model: ${OPENAI_TRANSCRIBE_MODEL:gpt-4o-mini-transcribe}
      transcribe-prompt: ${OPENAI_TRANSCRIBE_PROMPT:Consultation médicale en français entre un médecin et un patient, avec vocabulaire clinique, symptômes, examen, diagnostic, ordonnance, médicaments, posologies et constantes vitales. Conserver fidèlement les négations, nombres, unités, noms propres et noms de médicaments.}
      tts-model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
      tts-voice: ${OPENAI_TTS_VOICE:marin}
      tts-instructions: ${OPENAI_TTS_INSTRUCTIONS:Voix médicale professionnelle, calme, chaleureuse, concise et naturelle. Prononcer clairement les nombres, unités et noms de médicaments sans dramatiser.}
      realtime-model: ${OPENAI_REALTIME_MODEL:gpt-realtime}
      realtime-fallback-model: ${OPENAI_REALTIME_FALLBACK_MODEL:gpt-realtime-mini}
      realtime-voice: ${OPENAI_REALTIME_VOICE:marin}
      realtime-transcribe-model: ${OPENAI_REALTIME_TRANSCRIBE_MODEL:gpt-4o-transcribe}
      realtime-vad-eagerness: ${OPENAI_REALTIME_VAD_EAGERNESS:medium}
      realtime-noise-reduction: ${OPENAI_REALTIME_NOISE_REDUCTION:near_field}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
  medication-reference:
    enabled: ${JOPRELYS_MEDICATION_REFERENCE_ENABLED:false}
    cache-ttl-minutes: ${JOPRELYS_MEDICATION_REFERENCE_CACHE_TTL_MINUTES:1440}
    max-candidates: ${JOPRELYS_MEDICATION_REFERENCE_MAX_CANDIDATES:5}
    rxnorm:
      enabled: ${JOPRELYS_RXNORM_ENABLED:false}
      base-url: ${JOPRELYS_RXNORM_BASE_URL:https://rxnav.nlm.nih.gov}
  security:
    jwt:
      issuer: ${JOPRELYS_JWT_ISSUER:joprelys-connect}
      audience: ${JOPRELYS_JWT_AUDIENCE:joprelys-clinic}
      secret: ${JOPRELYS_JWT_SECRET:snMVSBygC5IUa+4aF3dOcjZ/UVlmb8UIYbfu7dFKu2SE6kZ/mJUg5fsNMbS1MCcfwU1XiqR1OA5Tga+UpPwcPA==}
      ttl-minutes: ${JOPRELYS_JWT_TTL_MINUTES:120}
  seed:
    admin:
      enabled: ${JOPRELYS_SEED_ADMIN_ENABLED:true}
      email: ${JOPRELYS_ADMIN_EMAIL:}
      name: ${JOPRELYS_ADMIN_NAME:}
      password: ${JOPRELYS_ADMIN_PASSWORD:}
  documents:
    storage-dir: ${JOPRELYS_DOCUMENTS_STORAGE_DIR:./storage/documents}
  storage:
    upload-dir: ${JOPRELYS_UPLOAD_DIR:./storage/uploads}
    verification-base-url: ${JOPRELYS_VERIFICATION_BASE_URL:https://joprelys.com/verify}
  lab-integration:
    api-key: ${JOPRELYS_LAB_INTEGRATION_API_KEY:}
  appointments:
    default-slot-duration-minutes: ${JOPRELYS_APPOINTMENTS_DEFAULT_SLOT_DURATION_MINUTES:30}
    booking-horizon-days: ${JOPRELYS_APPOINTMENTS_BOOKING_HORIZON_DAYS:30}
    patient-cancel-deadline-hours: ${JOPRELYS_APPOINTMENTS_PATIENT_CANCEL_DEADLINE_HOURS:24}
    reminder-hours-before: ${JOPRELYS_APPOINTMENTS_REMINDER_HOURS_BEFORE:24}
    timezone: ${JOPRELYS_APPOINTMENTS_TIMEZONE:Africa/Douala}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
  info:
    title: Joprelys Connect API
    description: Plateforme d'interopérabilité santé, dossier patient partagé et documents médicaux vérifiables
    version: 1.0.0
    contact:
      name: Joprelys HealthTech
      email: support@joprelys.com
    license:
      name: Proprietary
