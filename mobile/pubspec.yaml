name: joprelys_mobile
description: "Application mobile native Joprelys Connect."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cookie_jar: ^4.0.9
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: any
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
