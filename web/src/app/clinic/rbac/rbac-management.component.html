<app-shell>
  <app-page-header [title]="t('rbac.title')" [subtitle]="t('rbac.subtitle')" backLink="/dashboard" [backLabel]="t('common.back')">
    @if (platformAdministrator()) {
      <label class="sr-only" for="rbac-organization">{{ t('rbac.scope.label') }}</label>
      <select
        id="rbac-organization"
        class="ui-select w-full min-w-0 sm:w-auto sm:min-w-64"
        [value]="selectedOrganizationId() || ''"
        [disabled]="loading() || organizations().length === 0"
        (change)="selectOrganization($any($event.target).value)"
      >
        @for (organization of organizations(); track organization.id) {
          <option [value]="organization.id">
            {{ organization.name }} · {{ organization.city }}{{ organization.status === 'INACTIVE' ? ' · ' + t('rbac.scope.inactive') : '' }}
          </option>
        }
      </select>
    }
  </app-page-header>

  <main class="app-container min-w-0 space-y-4 overflow-x-hidden pb-12">
    @if (error(); as message) {
      <app-ui-alert tone="error">{{ message }}</app-ui-alert>
    }
    @if (success(); as message) {
      <app-ui-alert>{{ message }}</app-ui-alert>
    }

    <div class="flex min-w-0 gap-1 overflow-x-auto border-b border-[var(--app-border)]" role="tablist" [attr.aria-label]="t('rbac.tabs.label')" (keydown)="moveTab($event)">
      @for (tab of tabs; track tab) {
        <button
          type="button"
          role="tab"
          [id]="'rbac-tab-' + tab"
          aria-controls="rbac-tab-panel"
          [attr.aria-selected]="activeTab() === tab"
          [attr.tabindex]="activeTab() === tab ? 0 : -1"
          class="min-h-11 shrink-0 whitespace-nowrap border-b-2 px-4 text-sm font-semibold transition-colors hover:bg-[var(--app-surface-muted)] focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-[var(--brand-primary)]"
          [class]="activeTab() === tab ? 'border-[var(--brand-primary)] text-[var(--brand-primary)]' : 'border-transparent text-[var(--text-secondary)]'"
          (click)="setTab(tab)"
        >
          {{ t('rbac.tabs.' + tab) }}
        </button>
      }
    </div>

    <div id="rbac-tab-panel" role="tabpanel" [attr.aria-labelledby]="'rbac-tab-' + activeTab()" class="min-w-0">
      @if (loading()) {
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-[minmax(16rem,22rem)_minmax(0,1fr)]" aria-busy="true" [attr.aria-label]="t('common.loading')">
          <div class="ui-card h-72 motion-safe:animate-pulse"></div>
          <div class="ui-card h-72 motion-safe:animate-pulse"></div>
        </div>
      } @else if (activeTab() === 'users') {
        <app-rbac-users-panel [users]="users()" [roles]="roles()" [permissions]="permissions()" [saving]="saving()" (save)="saveUserRoles($event)" />
      } @else if (activeTab() === 'roles') {
        <app-rbac-role-editor [roles]="roles()" [permissions]="permissions()" [saving]="saving()" (save)="saveRole($event)" (notice)="showNotice($event)" />
      } @else {
        <app-rbac-audit-table [entries]="auditEntries()" [loading]="auditLoading()" (refresh)="loadAudit()" />
      }
    </div>
  </main>
</app-shell>
