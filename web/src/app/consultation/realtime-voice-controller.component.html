@if (enabled) {
  <div class="space-y-3">
    <app-voice-listening-surface
      [active]="state().connected && !effectiveMuted()"
      [audioLevel]="audioLevel()"
      [badgeText]="i18n.t('consultation.ai.aiInProgress', 'IA en cours...')"
      [stopText]="i18n.t('consultation.ai.stopListening', 'Arrêter')"
      [statusText]="listeningSurfaceStatus()"
      [tipText]="i18n.t('consultation.ai.tipDictateNaturally', 'Conseil : Vous pouvez dicter vos notes de consultation de façon naturelle.')"
      [accessibleLabel]="i18n.t('consultation.ai.microphoneLevelLabel', 'Niveau réel du microphone')"
      [stopDisabled]="finishPending()"
      (stop)="requestFinish()"
    />

    @if (showSafetyAlert() || backlogPaused || finishPending()) {
      <div
        class="rounded-[var(--radius-brand-sm)] border px-3 py-2 text-center text-xs font-semibold leading-5"
        [ngClass]="connectionBannerClasses()"
        role="status"
      >
        {{ connectionBannerText() }}
      </div>
    }

    <app-realtime-transcript-history
      [entries]="transcriptHistory()"
      [processing]="processing()"
      [queuedCount]="queuedCount()"
      [connected]="state().connected"
      [correctionDisabled]="blocked || finishPending() || processing() || queuedCount() > 0"
      (correct)="requestTranscriptCorrection($event)"
    />
  </div>
}
