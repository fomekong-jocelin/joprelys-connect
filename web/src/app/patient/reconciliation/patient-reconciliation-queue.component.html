<section class="ui-card p-4 sm:p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h2 class="font-display text-lg font-extrabold text-[var(--text-primary)]">
        {{ t('patientReconciliation.queue.title') }}
      </h2>
      <p class="mt-1 text-sm leading-6 text-[var(--text-muted)]">
        {{ t('patientReconciliation.queue.subtitle') }}
      </p>
    </div>
    <span class="rounded-sm border border-[var(--app-border)] bg-[var(--app-surface-muted)] px-2 py-1 text-xs font-bold text-[var(--text-muted)]">
      {{ items().length }}
    </span>
  </div>

  @if (items().length === 0) {
    <div class="ui-card-muted mt-4 px-4 py-8 text-center text-sm text-[var(--text-muted)]">
      {{ t('patientReconciliation.queue.empty') }}
    </div>
  } @else {
    <div class="mt-4 space-y-2">
      @for (item of items(); track item.patientId) {
        <button
          type="button"
          class="w-full rounded-sm border p-3 text-left transition-colors"
          [class.border-brand-primary]="selectedPatientId() === item.patientId"
          [class.bg-[var(--app-surface-muted)]]="selectedPatientId() === item.patientId"
          [class.border-[var(--app-border)]]="selectedPatientId() !== item.patientId"
          [attr.aria-pressed]="selectedPatientId() === item.patientId"
          (click)="selected.emit(item)"
        >
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="truncate font-extrabold text-[var(--text-primary)]">
                {{ item.displayName || item.temporaryPatientNumber }}
              </p>
              <p class="mt-1 text-xs font-semibold text-brand-primary">
                {{ item.temporaryPatientNumber }}
              </p>
            </div>
            <span class="shrink-0 rounded-sm border border-[var(--app-border)] bg-[var(--app-surface)] px-2 py-1 text-[10px] font-bold text-[var(--text-muted)]">
              {{ item.terminal
                ? t('patientReconciliation.queue.terminal')
                : t('patientReconciliation.queue.pending') }}
            </span>
          </div>

          <dl class="mt-3 grid gap-2 text-xs sm:grid-cols-2">
            <div>
              <dt class="ui-label">{{ t('patientReconciliation.queue.foundAt') }}</dt>
              <dd class="mt-1 text-[var(--text-primary)]">{{ formatDate(item.foundAt || item.createdAt) }}</dd>
            </div>
            <div>
              <dt class="ui-label">{{ t('patientReconciliation.queue.foundLocation') }}</dt>
              <dd class="mt-1 text-[var(--text-primary)]">
                {{ item.foundLocation || t('patientReconciliation.notRecorded') }}
              </dd>
            </div>
          </dl>

          @if (item.decision) {
            <p class="mt-3 border-t border-[var(--app-border)] pt-2 text-xs font-semibold text-[var(--text-muted)]">
              {{ t('patientReconciliation.decision.type.' + item.decision.toLowerCase()) }}
            </p>
          }
        </button>
      }
    </div>
  }
</section>
